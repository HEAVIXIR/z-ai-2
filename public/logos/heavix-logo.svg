<svg width="180" height="48" viewBox="0 0 180 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- H icon: two thick vertical strokes + orange diamond nexus -->
  <g>
    <!-- Left vertical stroke -->
    <rect x="2" y="6" width="10" height="36" rx="2" fill="#ffffff"/>
    <!-- Right vertical stroke -->
    <rect x="24" y="6" width="10" height="36" rx="2" fill="#ffffff"/>
    <!-- Orange nexus diamond -->
    <rect x="14" y="18" width="8" height="12" rx="1.5" transform="rotate(45 18 24)" fill="#F58220"/>
    <!-- Connection bar (thin) -->
    <rect x="2" y="22" width="32" height="4" rx="2" fill="#ffffff" opacity="0.15"/>
  </g>
  <!-- Wordmark HEAVIX -->
  <text x="44" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" letter-spacing="1">HEAV<tspan fill="#F58220">IX</tspan></text>
  <!-- Tagline -->
  <text x="44" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#8c8c8c" letter-spacing="2.5">BUY / SELL / LIST</text>
</svg>

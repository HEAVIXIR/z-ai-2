<svg width="200" height="48" viewBox="0 0 200 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- M icon: two angled strokes meeting at bottom + orange diamond nexus -->
  <g>
    <!-- Left angled stroke -->
    <path d="M2 6 L12 6 L18 36 L8 36 Z" fill="#ffffff"/>
    <!-- Right angled stroke -->
    <path d="M34 6 L24 6 L18 36 L28 36 Z" fill="#ffffff"/>
    <!-- Orange nexus diamond -->
    <rect x="14" y="18" width="8" height="12" rx="1.5" transform="rotate(45 18 24)" fill="#F58220"/>
  </g>
  <!-- Wordmark MEKANIX -->
  <text x="44" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#ffffff" letter-spacing="1">MEKAN<tspan fill="#F58220">IX</tspan></text>
  <!-- Tagline -->
  <text x="44" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#8c8c8c" letter-spacing="2.5">REPAIR / MAINTAIN / CONNECT</text>
</svg>

name: OpenNext runtime integration proof

on:
  pull_request:
    branches:
      - infra/prisma6-cloudflare-runtime
    paths:
      - "src/app/api/opennext-runtime-proof/**"
      - "src/app/sitemap.ts"
      - "src/lib/db.worker.ts"
      - "src/lib/store-db.worker.ts"
      - "src/lib/opennext-proof-guards.ts"
      - "tests/unit/opennext-runtime-proof-guards.test.ts"
      - "src/lib/prisma-worker-clients.ts"
      - "src/lib/prisma-worker-proxy.ts"
      - "scripts/run-opennext-runtime-proof.mjs"
      - "scripts/audit-opennext-worker-bundle.mjs"
      - "docs/architecture/opennext-runtime-integration-proof.md"
      - "wrangler.jsonc"
      - "next.config.ts"
      - "package.json"
      - "bun.lock*"
      - ".github/workflows/opennext-runtime-integration-proof.yml"

permissions:
  contents: read

concurrency:
  group: opennext-runtime-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  open-next-workerd-smoke:
    name: OpenNext real-route smoke (no DB credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run OpenNext proof guard and read-only SQL tests
        run: bunx vitest run tests/unit/opennext-runtime-proof-guards.test.ts
      - name: Build OpenNext Worker and exercise real App Router path
        env:
          CI: "1"
        run: bun scripts/run-opennext-runtime-proof.mjs

      - name: Audit generated Worker bundle (heuristic)
        if: success()
        run: bun scripts/audit-opennext-worker-bundle.mjs

      - name: Upload Worker bundle audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavix-opennext-worker-bundle-audit
          path: .open-next/audit/worker-bundle-audit.json
          if-no-files-found: warn
          retention-days: 7

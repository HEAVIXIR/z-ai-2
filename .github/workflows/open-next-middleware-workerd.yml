name: Cloudflare OpenNext Edge Middleware Workerd Proof

on:
  pull_request:
    branches:
      - "integration/**"
    paths:
      - "src/middleware.ts"
      - "src/lib/site-config.ts"
      - "src/app/robots.ts"
      - "src/app/sitemap.ts"
      - "src/app/layout.tsx"
      - "apply_r45_remediation.py"
      - "tests/contract/r45-canonical-auth-contract.test.ts"
      - "tests/contract/seo-public-metadata.test.ts"
      - "tests/security/auth-boundary.test.ts"
      - "tests/unit/proxy.test.ts"
      - "tests/unit/seo-preview-policy.test.ts"
      - "tests/unit/preview-middleware.test.ts"
      - "tests/unit/site-config.test.ts"
      - ".github/workflows/open-next-middleware-workerd.yml"
      - "scripts/test-open-next-middleware-workerd.mjs"
      - "open-next.config.ts"
      - "wrangler.jsonc"
      - "package.json"
      - "bun.lock"

permissions:
  contents: read

concurrency:
  group: heavix-open-next-middleware-workerd-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  middleware-workerd:
    name: OpenNext Edge Middleware request-path proof (local Workerd only)
    if: startsWith(github.event.pull_request.head.ref, 'fix/next16-proxy-convention-') || github.event.pull_request.head.ref == 'integration/cloudflare-preview-r45-auth-2026-11-08'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAVIX_BUILD_TARGET: cloudflare
      NODE_ENV: production
      HEAVIX_ENV: preview
      HEAVIX_PREVIEW_URL: https://heavix-preview.heavixir.workers.dev
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate Main and Store Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store/schema.prisma

      - name: Build OpenNext Worker artifact
        run: bunx opennextjs-cloudflare build --noMinify

      - name: Exercise Edge Middleware through local Workerd
        run: bun run test:open-next-middleware-workerd

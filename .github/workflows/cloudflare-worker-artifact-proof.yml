name: Cloudflare Worker Artifact Proof

on:
  push:
    branches:
      - infra/prisma6-cloudflare-runtime
  pull_request:
    paths:
      - "next.config.ts"
      - "open-next.config.ts"
      - "scripts/cloudflare-next-build-diagnostics.mjs"
      - "prisma/**"
      - "src/lib/**"
      - "package.json"
      - "bun.lock"
      - "wrangler.jsonc"
      - ".github/workflows/cloudflare-worker-artifact-proof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare-worker-artifact:
    name: Cloudflare Workerd WASM bundle
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEAVIX_BUILD_TARGET: cloudflare
      HEAVIX_ENV: preview
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://heavix-preview.heavixir.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install locked dependencies and generate Prisma clients
        run: bun install --frozen-lockfile

      - name: Build OpenNext Worker
        run: bunx opennextjs-cloudflare build --noMinify

      - name: Produce Wrangler dry-run bundle
        run: bunx wrangler deploy --dry-run --outdir=/tmp/heavix-worker-dry

      - name: Assert Workerd-compatible Prisma WASM loader
        shell: bash
        run: |
          set -euo pipefail
          outdir=/tmp/heavix-worker-dry
          worker="$outdir/worker.js"
          test -s "$worker"

          compile_count="$(grep -Roh 'compileStreaming' "$outdir" --include='*.js' --include='*.mjs' | wc -l | tr -d ' ' || true)"
          instantiate_count="$(grep -Roh 'instantiateStreaming' "$outdir" --include='*.js' --include='*.mjs' | wc -l | tr -d ' ' || true)"
          loader_count="$(grep -Roh 'loadWasmChunk' "$outdir" --include='*.js' --include='*.mjs' | wc -l | tr -d ' ' || true)"
          wasm_count="$(find "$outdir" -type f -name '*.wasm' | wc -l | tr -d ' ')"

          echo "HEAVIX_WASM_ARTIFACT compileStreaming=$compile_count instantiateStreaming=$instantiate_count loadWasmChunk=$loader_count wasmFiles=$wasm_count"

          test "$compile_count" -eq 0
          test "$instantiate_count" -eq 0
          test "$loader_count" -gt 0
          test "$wasm_count" -gt 0

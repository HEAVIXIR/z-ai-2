name: HEAVIX App Preview ProductModelAttribute Migration

on:
  workflow_dispatch:
    inputs:
      target:
        description: This workflow can only migrate the dedicated App Preview database
        required: true
        type: choice
        options:
          - APP_PREVIEW_ONLY
      confirm:
        description: Type APPLY_PRODUCT_MODEL_ATTRIBUTES_TO_APP_PREVIEW
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: heavix-app-preview-product-model-attributes-migration
  cancel-in-progress: false

jobs:
  migrate-app-preview:
    name: Apply one reviewed migration to App Preview only
    if: github.ref == 'refs/heads/integration/preview-readiness-workerd-2026-11-15'
    runs-on: ubuntu-latest
    environment: preview-backup
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.MAIN_PREVIEW_DATABASE_URL }}
      STORE_DATABASE_URL: ${{ secrets.STORE_PREVIEW_DATABASE_URL }}
      HEAVIX_APP_PREVIEW_DATABASE_OID: ${{ secrets.HEAVIX_APP_PREVIEW_DATABASE_OID }}
      DISPATCH_TARGET: ${{ inputs.target }}
      DISPATCH_CONFIRM: ${{ inputs.confirm }}

    steps:
      - name: Checkout exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Enforce exact branch, commit and explicit App Preview confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/integration/preview-readiness-workerd-2026-11-15"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$DISPATCH_TARGET" = "APP_PREVIEW_ONLY"
          test "$DISPATCH_CONFIRM" = "APPLY_PRODUCT_MODEL_ATTRIBUTES_TO_APP_PREVIEW"
          echo "Exact branch, commit and App Preview-only dispatch gates passed."

      - name: Install Bun and locked dependencies
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate exact App Preview identity and migration preconditions
        shell: bash
        env:
          EXPECTED_SYSTEM_IDENTIFIER: "7701427422680793119"
        run: |
          set -euo pipefail
          test -n "$DATABASE_URL"
          test -n "$STORE_DATABASE_URL"
          test "$DATABASE_URL" != "$STORE_DATABASE_URL"
          [[ "$HEAVIX_APP_PREVIEW_DATABASE_OID" =~ ^[1-9][0-9]{0,9}$ ]]
          (( HEAVIX_APP_PREVIEW_DATABASE_OID <= 4294967295 ))
          test -f prisma/migrations/20261114150000_product_model_attributes/migration.sql

          export PGSSLMODE=verify-full
          identity="$(psql "$DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "SELECT current_database() || '|' || (SELECT oid::text FROM pg_database WHERE datname = current_database()) || '|' || (SELECT system_identifier::text FROM pg_control_system())")"
          expected="postgres|$HEAVIX_APP_PREVIEW_DATABASE_OID|$EXPECTED_SYSTEM_IDENTIFIER"
          test "$identity" = "$expected" || {
            echo "App Preview identity mismatch; refusing migration. Actual identity was not printed."
            exit 1
          }

          successful_migrations="$(psql "$DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "SELECT count(*)::text || '|' || string_agg(migration_name, ',' ORDER BY migration_name) FROM public._prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL")"
          expected_migrations="3|20261025081255_init_postgresql_baseline,20261025193000_add_auditlog_idempotency_key,20261112160000_add_selectable_hero_templates"
          test "$successful_migrations" = "$expected_migrations" || {
            echo "Unexpected App Preview migration history; refusing to apply any migration."
            exit 1
          }

          preconditions="$(psql "$DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "SELECT (to_regclass('public."ProductModelAttribute"') IS NULL)::text || '|' || (to_regclass('public."ProductModel"') IS NOT NULL)::text || '|' || (to_regclass('public."Category"') IS NOT NULL)::text || '|' || (to_regclass('public."AttributeDefinition"') IS NOT NULL)::text")"
          test "$preconditions" = "true|true|true|true" || {
            echo "ProductModelAttribute migration preconditions failed; refusing migration."
            exit 1
          }

          migration_dir_count="$(find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql -type f | wc -l | tr -d ' ')"
          test "$migration_dir_count" = "4" || {
            echo "Unexpected number of App migration files; refusing to apply more than the reviewed migration."
            exit 1
          }
          echo "PASS: App Preview identity, migration history, referenced tables and single-pending-migration checks."

      - name: Install frozen dependencies
        run: bun install --frozen-lockfile

      - name: Apply the single reviewed App Preview migration
        run: bunx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Verify migration record and resulting schema
        shell: bash
        env:
          EXPECTED_SYSTEM_IDENTIFIER: "7701427422680793119"
        run: |
          set -euo pipefail
          export PGSSLMODE=verify-full
          identity="$(psql "$DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "SELECT current_database() || '|' || (SELECT oid::text FROM pg_database WHERE datname = current_database()) || '|' || (SELECT system_identifier::text FROM pg_control_system())")"
          expected="postgres|$HEAVIX_APP_PREVIEW_DATABASE_OID|$EXPECTED_SYSTEM_IDENTIFIER"
          test "$identity" = "$expected" || {
            echo "Post-migration identity mismatch; stopping."
            exit 1
          }

          successful_migrations="$(psql "$DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "SELECT count(*)::text || '|' || string_agg(migration_name, ',' ORDER BY migration_name) FROM public._prisma_migrations WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL")"
          expected_migrations="4|20261025081255_init_postgresql_baseline,20261025193000_add_auditlog_idempotency_key,20261112160000_add_selectable_hero_templates,20261114150000_product_model_attributes"
          test "$successful_migrations" = "$expected_migrations"

          schema_fingerprint="$(psql "$DATABASE_URL" -XAtq -v ON_ERROR_STOP=1 -c "SELECT (SELECT count(*) FROM information_schema.columns WHERE table_schema='public' AND table_name='ProductModelAttribute')::text || '|' || (SELECT count(*) FROM pg_indexes WHERE schemaname='public' AND tablename='ProductModelAttribute')::text || '|' || (SELECT count(*) FROM pg_constraint c JOIN pg_class t ON t.oid=c.conrelid JOIN pg_namespace n ON n.oid=t.relnamespace WHERE n.nspname='public' AND t.relname='ProductModelAttribute')::text")"
          test "$schema_fingerprint" = "11|4|4" || {
            echo "Post-migration ProductModelAttribute schema fingerprint mismatch."
            exit 1
          }

          bunx prisma migrate status --schema=prisma/schema.prisma
          echo "PASS: only the reviewed ProductModelAttribute migration is recorded and its table, indexes and constraints are present."

name: Next.js PR 100391 isolated proof

on:
  push:
    branches:
      - experiments/next-pr100391-wasm-trace-proof

permissions:
  contents: read

concurrency:
  group: next-pr100391-proof
  cancel-in-progress: true

jobs:
  patched-next-proof:
    name: Build patched Next and verify HEAVIX artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      MIN_MEMORY_GIB: "8"
      MIN_CPU_CORES: "4"
      MIN_DISK_GIB: "8"
      MAX_UNIQUE_TRACE_FILES: "5000"
      HEAVIX_REF: "07b6de155284dd7813335201552acf4efbb6ad90"
    steps:
      - name: Checkout experiment scripts
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.33.0"

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install shell lint tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Lint experiment scripts
        run: |
          bash -n ops-verification/build-patched-next-pr100391.sh
          bash -n ops-verification/verify-patched-next-pr100391.sh
          shellcheck ops-verification/build-patched-next-pr100391.sh
          shellcheck ops-verification/verify-patched-next-pr100391.sh
          cargo --version
          rustc --version
          (cd "$RUNNER_TEMP" && pnpm --version)
          bun --version

      - name: Build patched Next.js 16.4.5 package set
        run: |
          bash ops-verification/build-patched-next-pr100391.sh artifacts/next-pr100391

      - name: Verify patched Next against exact HEAVIX commit
        run: |
          bash ops-verification/verify-patched-next-pr100391.sh artifacts/next-pr100391

      - name: Upload verification evidence (not package tarballs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-pr100391-heavix-proof
          if-no-files-found: warn
          retention-days: 14
          path: |
            artifacts/next-pr100391/BUILD-MANIFEST.txt
            artifacts/next-pr100391/upstream-source-commit.txt
            artifacts/next-pr100391/pr100391.patch
            artifacts/next-pr100391/pr100391.patch.sha256
            artifacts/next-pr100391/SHA256SUMS
            artifacts/next-pr100391/types-dir-before-pack.txt
            artifacts/next-pr100391/next-tar-file-list.txt
            artifacts/next-pr100391/next-tar-global-dts-matches.txt
            artifacts/heavix-pr100391-verification/

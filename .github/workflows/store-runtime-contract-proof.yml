          # NOTE: trap already set above to cleanup_monitor AND cleanup_smaps
          # Do NOT overwrite — first trap handles both
          touch .ci-artifacts/oom-instrumentation/stage-markers.log
          # STEP 17.86: controlled OpenNext baseline/profiler on the isolated Worker trace.
          # The only intended difference is LD_PRELOAD; both runs retain the same
          # Node V8 hook, OpenNext arguments, environment, and generated input.
          mkdir -p .ci-artifacts/oom-instrumentation .ci-artifacts/opennext-baseline
          : > /tmp/v8-memory-samples.log
          : > /tmp/smaps-samples.jsonl
          touch .ci-artifacts/oom-instrumentation/stage-markers.log

          # Record whether the runner sends a shutdown signal before the build can
          # write its own exit marker. EXIT still runs the existing monitor cleanup.
          trap 'SIGNAL_LINE="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) signal=TERM pid=$$"; printf "%s\n" "$SIGNAL_LINE" | tee -a .ci-artifacts/oom-instrumentation/runner-signals.log >&2; exit 143' TERM
          trap 'SIGNAL_LINE="$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) signal=INT pid=$$"; printf "%s\n" "$SIGNAL_LINE" | tee -a .ci-artifacts/oom-instrumentation/runner-signals.log >&2; exit 130' INT

          run_opennext() {
            local mode="$1"
            local fifo="/tmp/opennext-${mode}.fifo"
            local output=".ci-artifacts/oom-instrumentation/opennext-${mode}.log"
            local pid exit_code
            rm -f "$fifo"
            mkfifo "$fifo"
            printf '%s\n' "$mode" > /tmp/opennext-build-mode
            echo "=== STEP 17.86: OpenNext mode=$mode ==="
            date -u
            free -h
            grep -E 'MemTotal|MemAvailable|SwapTotal|SwapFree' /proc/meminfo
            if [ "$mode" = "baseline" ]; then
              env -u LD_PRELOAD HEAVIX_BUILD_MODE="$mode" NODE_OPTIONS="$NODE_OPTIONS" /usr/bin/time -v ./node_modules/.bin/opennextjs-cloudflare build --skipNextBuild --noMinify > "$fifo" 2>&1 &
            else
              env HEAVIX_BUILD_MODE="$mode" NODE_OPTIONS="$NODE_OPTIONS" LD_PRELOAD=/tmp/mallinfo_preload.so:/tmp/malloc_profiler_v6.so /usr/bin/time -v ./node_modules/.bin/opennextjs-cloudflare build --skipNextBuild --noMinify > "$fifo" 2>&1 &
            fi
            pid=$!
            (
              while IFS= read -r line; do
                printf '%s\n' "$line" | tee -a "$output"
                case "$line" in
                  *"Building Next.js app"*) echo "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) mode=$mode STAGE: Building Next.js app" >> .ci-artifacts/oom-instrumentation/stage-markers.log ;;
                  *"Generating bundle"*) echo "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) mode=$mode STAGE: Generating bundle" >> .ci-artifacts/oom-instrumentation/stage-markers.log ;;
                  *"Bundling middleware"*) echo "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) mode=$mode STAGE: Bundling middleware" >> .ci-artifacts/oom-instrumentation/stage-markers.log ;;
                  *"Bundling static assets"*) echo "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) mode=$mode STAGE: Bundling static assets" >> .ci-artifacts/oom-instrumentation/stage-markers.log ;;
                  *"Bundling cache assets"*) echo "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) mode=$mode STAGE: Bundling cache assets" >> .ci-artifacts/oom-instrumentation/stage-markers.log ;;
                  *"Building server function: default"*) echo "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) mode=$mode STAGE: createServerBundle START" >> .ci-artifacts/oom-instrumentation/stage-markers.log ;;
                  *"Bundling the OpenNext server"*) echo "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) mode=$mode STAGE: bundleServer START" >> .ci-artifacts/oom-instrumentation/stage-markers.log ;;
                  *"Worker saved"*) echo "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) mode=$mode STAGE: bundleServer COMPLETE" >> .ci-artifacts/oom-instrumentation/stage-markers.log ;;
                  *"OpenNext build complete"*) echo "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) mode=$mode STAGE: OpenNext build complete" >> .ci-artifacts/oom-instrumentation/stage-markers.log ;;
                esac
              done
            ) < "$fifo"
            if wait "$pid"; then exit_code=0; else exit_code=$?; fi
            rm -f "$fifo"
            printf '%s\n' "$exit_code" > ".ci-artifacts/oom-instrumentation/opennext-${mode}.exit"
            echo "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ) mode=$mode OpenNext exit=$exit_code" | tee -a .ci-artifacts/oom-instrumentation/stage-markers.log
            return 0
          }

          # Fingerprint the Worker input tree so both runs are provably comparable.
          NEXT_SERVER_SHA_BEFORE=$(find .next/server -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          printf 'NEXT_SERVER_SHA_BEFORE=%s\n' "$NEXT_SERVER_SHA_BEFORE" | tee .ci-artifacts/oom-instrumentation/input-fingerprint.txt
          # Baseline first; keep .next/server unchanged for the profiler run.
          rm -rf .open-next
          run_opennext baseline
          BASELINE_EXIT=$(cat .ci-artifacts/oom-instrumentation/opennext-baseline.exit)
          NEXT_SERVER_SHA_AFTER=$(find .next/server -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | awk '{print $1}')
          printf 'NEXT_SERVER_SHA_AFTER_BASELINE=%s\n' "$NEXT_SERVER_SHA_AFTER" | tee -a .ci-artifacts/oom-instrumentation/input-fingerprint.txt
          if [ "$NEXT_SERVER_SHA_BEFORE" != "$NEXT_SERVER_SHA_AFTER" ]; then
            echo "FAIL: OpenNext baseline mutated .next/server; refusing non-identical A/B comparison"
            exit 1
          fi
          if [ "$BASELINE_EXIT" -ne 0 ]; then
            echo "PROFILER_SKIPPED=baseline_failed_exit_$BASELINE_EXIT" | tee .ci-artifacts/oom-instrumentation/ab-summary.txt
            echo "FAIL: profiler is intentionally skipped because the baseline did not complete successfully"
            exit 1
          fi
          if [ -d .open-next ]; then
            bun run verify:store-runtime-artifacts -- worker .open-next > .ci-artifacts/oom-instrumentation/baseline-artifact-verification.log 2>&1 || echo "BASELINE_ARTIFACT_VERIFY_EXIT=$?" >> .ci-artifacts/oom-instrumentation/baseline-artifact-verification.log
            cp -a .open-next/. .ci-artifacts/opennext-baseline/
          else
            echo "BASELINE_OUTPUT_MISSING=1" > .ci-artifacts/oom-instrumentation/baseline-artifact-verification.log
          fi
          rm -rf .open-next

          # Profiler comparison uses the same checked-in inputs and exact command.
          run_opennext profiler
          PROFILER_EXIT=$(cat .ci-artifacts/oom-instrumentation/opennext-profiler.exit)
          printf 'BASELINE_EXIT=%s\nPROFILER_EXIT=%s\n' "$BASELINE_EXIT" "$PROFILER_EXIT" | tee .ci-artifacts/oom-instrumentation/ab-summary.txt
          if [ "$BASELINE_EXIT" -ne 0 ] || [ "$PROFILER_EXIT" -ne 0 ]; then
            echo "FAIL: controlled OpenNext A/B requires both baseline and profiler exits to be 0"
            exit 1
          fi
          bun run verify:store-runtime-artifacts -- worker .open-next
      - name: Upload OOM instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oom-instrumentation-${{ github.sha }}
          path: |
            .ci-artifacts/oom-instrumentation/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload smaps memory analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smaps-analysis-${{ github.sha }}
          path: |
            /tmp/smaps-samples.jsonl
            /tmp/smaps-snapshots/
          if-no-files-found: warn
          retention-days: 30
      - name: Upload V8 memory samples (backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v8-memory-samples-${{ github.sha }}
          path: |
            /tmp/v8-memory-samples.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload Node and Worker build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-runtime-artifacts-${{ github.sha }}
          path: |
            .ci-artifacts/node/server
            .ci-artifacts/opennext-baseline
            .next/server
            .open-next
          if-no-files-found: warn
          retention-days: 14

name: HEAVIX Preview existing owner identity transfer

on:
  workflow_dispatch:
    inputs:
      mode:
        description: DRY_RUN checks only; APPLY performs the one-time identity transfer
        required: true
        type: choice
        default: DRY_RUN
        options:
          - DRY_RUN
          - APPLY
      backup_run_id:
        description: Successful paired encrypted Preview backup run ID from this exact commit SHA
        required: true
        type: string
      confirmation:
        description: For APPLY only, type TRANSFER_EXISTING_OWNER_TO_PREVIEW_ONLY
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: heavix-preview-existing-owner-transfer
  cancel-in-progress: false

jobs:
  transfer-owner:
    if: github.ref == 'refs/heads/integration/preview-readiness-workerd-2026-11-15'
    environment: preview-backup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact dispatched commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Validate branch, mode and exact-SHA encrypted backup
        shell: bash
        env:
          TRANSFER_MODE: ${{ inputs.mode }}
          TRANSFER_CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_RUN_ID: ${{ inputs.backup_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/integration/preview-readiness-workerd-2026-11-15"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          case "$TRANSFER_MODE" in
            DRY_RUN) test -z "$TRANSFER_CONFIRMATION" ;;
            APPLY) test "$TRANSFER_CONFIRMATION" = "TRANSFER_EXISTING_OWNER_TO_PREVIEW_ONLY" ;;
            *) echo "Unknown transfer mode."; exit 1 ;;
          esac
          [[ "$BACKUP_RUN_ID" =~ ^[0-9]+$ ]] || { echo "Backup run ID must be numeric."; exit 1; }

          api="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID"
          run_json="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" "$api")"
          jq -e --arg sha "$GITHUB_SHA" \
                --arg branch "integration/preview-readiness-workerd-2026-11-15" \
                '.head_sha == $sha and .head_branch == $branch and .status == "completed" and .conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/prisma-preview-backup-to-b2.yml"' \
                <<< "$run_json" >/dev/null || {
                  echo "Backup run is not a successful paired Preview backup for this exact commit and branch."
                  exit 1
                }

          jobs_json="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$BACKUP_RUN_ID/jobs")"
          jq -e '.jobs | any(.[]; .name == "paired-backup" and .conclusion == "success")' \
            <<< "$jobs_json" >/dev/null || {
              echo "The paired-backup job did not report success."
              exit 1
            }
          echo "PASS: exact branch and SHA; paired encrypted Preview backup run and job succeeded."
          echo "PASS: mode and confirmation gates validated; no database write has occurred."

      - name: Validate protected Preview connection secrets without printing values
        shell: bash
        env:
          SOURCE_DATABASE_URL: ${{ secrets.HEAVIX_OWNER_SOURCE_DATABASE_URL }}
          TARGET_DATABASE_URL: ${{ secrets.MAIN_PREVIEW_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_DATABASE_URL" || { echo "Missing HEAVIX_OWNER_SOURCE_DATABASE_URL in protected preview-backup environment."; exit 1; }
          test -n "$TARGET_DATABASE_URL" || { echo "Missing MAIN_PREVIEW_DATABASE_URL in protected preview-backup environment."; exit 1; }
          test "$SOURCE_DATABASE_URL" != "$TARGET_DATABASE_URL" || { echo "Source and target credentials must be distinct."; exit 1; }
          case "$SOURCE_DATABASE_URL" in postgres://*|postgresql://*) ;; *) echo "Source URL scheme invalid."; exit 1 ;; esac
          case "$TARGET_DATABASE_URL" in postgres://*|postgresql://*) ;; *) echo "Target URL scheme invalid."; exit 1 ;; esac
          echo "PASS: both protected PostgreSQL URLs are present, distinct and redacted."

      - name: Install PostgreSQL client library
        run: npm install --no-save --ignore-scripts --package-lock=false pg@8.16.3

      - name: Run guarded Preview owner transfer preflight or apply
        shell: bash
        env:
          HEAVIX_OWNER_SOURCE_DATABASE_URL: ${{ secrets.HEAVIX_OWNER_SOURCE_DATABASE_URL }}
          MAIN_PREVIEW_DATABASE_URL: ${{ secrets.MAIN_PREVIEW_DATABASE_URL }}
          TRANSFER_MODE: ${{ inputs.mode }}
          TRANSFER_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/transfer-owner-preview.mjs

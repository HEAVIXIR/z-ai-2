name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

jobs:
  # ── BLOCKING job: all required security/contract/integration/build tests ──
  # Any failure fails the workflow and blocks merge.
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heavix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_test?schema=public"
      STORE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_store_test?schema=public"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-password-not-real"

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Validate and exercise the Preview SQLite schema (disposable file only)
        env:
          PREVIEW_DATABASE_URL: "file:/tmp/heavix-preview-schema-validation.db"
        run: |
          bash tests/preview-schema-sync.sh
          bunx prisma validate --schema=prisma/preview-schema.prisma
          bun run db:push:preview
          bash tests/database-runtime-build.sh
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store/schema.prisma
      - name: Create store test database
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE heavix_store_test;"
      - name: Push schemas
        run: |
          bunx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          bunx prisma db push --accept-data-loss --schema=prisma/store/schema.prisma
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Seed RBAC
        run: bun run db:seed-rbac
      - name: Seed catalog data
        run: |
          bun run db:seed-brands-a
          bun run db:seed-brands-b
          bun run db:seed-user-roles
          bun run db:seed-test-fixtures
      - name: Create read-only PostgreSQL role (STEP 15.51)
        run: |
          # CR-15.51-04: Generate random password, never hard-coded
          DRYUN_RO_PW=$(openssl rand -hex 16)
          echo "DRYUN_RO_PW=$DRYUN_RO_PW" >> $GITHUB_ENV
          # CR-15.51-04: Pass password as psql variable (not SQL current_setting)
          PGPASSWORD=postgres psql -h localhost -U postgres -d heavix_test \
            -v dryrun_password="$DRYUN_RO_PW" \
            -f scripts/rbac-create-readonly-role.sql
      - name: Security tests
        run: bun run test:security
      - name: Phase C dry-run gate (not executed against non-TLS PostgreSQL service)
        # This generic postgres:17 service is not configured for TLS, so this step
        # does not execute the Phase C dry-run and does not establish Finding D.
        # Real connection-path TLS evidence is produced by the separate tls-proof
        # job, which provisions TLS-enabled PostgreSQL 17 and requires all 13
        # behavioral tests to have status "passed" (zero skips or other statuses).
        run: |
          echo "── Phase C dry-run gate NOT EXECUTED — this PostgreSQL service has no TLS configuration."
          echo "   This step does not establish or reopen Finding D."
          echo "   See the separate tls-proof job for real TLS connection-path validation."
          echo "── Gate intentionally not run against the non-TLS service."
      - name: Integration — tenant-scope-real
        run: bunx tsx tests/integration/tenant-scope-real.ts
      - name: Integration — readonly-when-concurrency-real
        run: bunx tsx tests/integration/readonly-when-concurrency-real.ts
      - name: Integration — payment-concurrency-real
        run: bunx tsx tests/integration/payment-concurrency-real.ts
      - name: Integration — deal-concurrency-real (STEP 13.36 P2-A)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/deal-concurrency-real.ts
      - name: Integration — p3a-http-db-real (STEP 13.54 Phase 2 P3-A)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/p3a-http-db-real.ts
      - name: Integration — p3a-auth-real-http-db (STEP 13.55 Commit B P3-A)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/p3a-auth-real-http-db.ts
      - name: Store + Outbox PostgreSQL behavioral gate (fail closed)
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_test?schema=public"
          STORE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_store_test?schema=public"
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "FAIL: DATABASE_URL is required"; exit 1; }
          test -n "${STORE_DATABASE_URL:-}" || { echo "FAIL: STORE_DATABASE_URL is required"; exit 1; }
          REPORT_FILE=$(mktemp)
          trap 'rm -f "$REPORT_FILE"' EXIT
          VITEST_EXIT=0
          bunx vitest run tests/integration/store-audit-outbox-resilience.test.ts tests/integration/store-inventory-return-atomicity.test.ts --reporter=json --outputFile="$REPORT_FILE" || VITEST_EXIT=$?
          test -s "$REPORT_FILE" || { echo "FAIL: Store/Outbox Vitest report missing"; exit 1; }
          node - "$REPORT_FILE" "$VITEST_EXIT" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const exitCode = Number(process.argv[3]);
          const tests = (report.testResults || []).flatMap(file => file.assertionResults || []);
          const skipped = tests.filter(test => ['pending', 'skipped', 'todo'].includes(test.status));
          if (exitCode !== 0 || (report.numFailedTests || 0) > 0 || (report.numPendingTests || 0) > 0 || skipped.length > 0 || tests.length === 0) {
            console.error(JSON.stringify({
              exitCode,
              numTotalTests: report.numTotalTests,
              numPassedTests: report.numPassedTests,
              numFailedTests: report.numFailedTests,
              numPendingTests: report.numPendingTests,
              skippedTests: skipped.map(test => test.fullName || test.title),
              observedTests: tests.length
            }, null, 2));
            process.exit(1);
          }
          console.log(`PASS: ${tests.length} Store/Outbox PostgreSQL behavioral tests passed; no skips or pending tests.`);
          NODE
      - name: Manual Store SQL invariants (PostgreSQL 17; direct SQL only)
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          {
            echo "commit: $GITHUB_SHA"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -Atc "SHOW server_version;"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "DROP DATABASE IF EXISTS heavix_store_manual_sql_proof WITH (FORCE);"
            psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE heavix_store_manual_sql_proof;"
            STORE_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/heavix_store_manual_sql_proof?schema=public" \
              bunx prisma migrate deploy --schema=prisma/store/schema.prisma
            STORE_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/heavix_store_manual_sql_proof?schema=public" \
              bunx prisma migrate status --schema=prisma/store/schema.prisma
            psql -h localhost -U postgres -d heavix_store_manual_sql_proof -v ON_ERROR_STOP=1 \
              -f ops-verification/evidence/store-outbox-behavioral-tests-real.sql
          } 2>&1 | tee "$RUNNER_TEMP/store-manual-sql-output.txt"
      - name: Store backup/restore proof (disposable PostgreSQL 17)
        env:
          HEAVIX_ALLOW_DISPOSABLE_DB_RESET: '1'
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          bash scripts/test-store-backup-restore-ci.sh 2>&1 | tee "$RUNNER_TEMP/store-backup-restore-output.txt"
      - name: Upload reproducible Store/Outbox evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: store-outbox-evidence-${{ github.sha }}
          path: |
            ${{ runner.temp }}/store-manual-sql-output.txt
            ${{ runner.temp }}/store-backup-restore-output.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Integration test files
        env:
          DRYUN_RO_PW: ${{ env.DRYUN_RO_PW }}
        # Store/Outbox suites run above in a dedicated fail-closed gate. Do not
        # run those same DB suites a second time in this broad parallel sweep:
        # duplicate generated-client loading can fail after the dedicated gate
        # has already passed. The dedicated gate remains authoritative.
        run: >-
          bunx vitest run tests/integration/*.test.ts
          --exclude tests/integration/store-audit-outbox-resilience.test.ts
          --exclude tests/integration/store-inventory-return-atomicity.test.ts
      - name: All contract + unit tests
        run: bunx vitest run tests/contract/ tests/unit/
      - name: E2E smoke tests
        run: bunx vitest run tests/e2e/
      - name: "PostgreSQL migration proof: migrate deploy on fresh DBs (Main + Store)"
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Create fresh isolated databases for migration proof (not the test DBs used by other steps)
          psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS heavix_migrate_main_proof;"
          psql -h localhost -U postgres -c "CREATE DATABASE heavix_migrate_main_proof;"
          psql -h localhost -U postgres -c "DROP DATABASE IF EXISTS heavix_migrate_store_proof;"
          psql -h localhost -U postgres -c "CREATE DATABASE heavix_migrate_store_proof;"

          echo "── Main: migrate deploy on fresh DB ──"
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/heavix_migrate_main_proof?schema=public" \
            bunx prisma migrate deploy --schema=prisma/schema.prisma
          echo ""
          echo "── Main: migrate status ──"
          DATABASE_URL="postgresql://postgres:postgres@localhost:5432/heavix_migrate_main_proof?schema=public" \
            bunx prisma migrate status --schema=prisma/schema.prisma
          echo ""
          echo "── Store: migrate deploy on fresh DB ──"
          STORE_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/heavix_migrate_store_proof?schema=public" \
            bunx prisma migrate deploy --schema=prisma/store/schema.prisma
          echo ""
          echo "── Store: migrate status ──"
          STORE_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/heavix_migrate_store_proof?schema=public" \
            bunx prisma migrate status --schema=prisma/store/schema.prisma
          echo ""
          echo "✓ Both migration histories deployed and verified on fresh PostgreSQL 17 databases."
      - name: "PostgreSQL migration proof: adopt existing Main + Store schemas without data loss"
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          sudo apt-get install -y postgresql-client
          bash scripts/test-migration-baseline-adoption.sh
      - name: Production build
        run: bun run build
      - name: Integration — p3a-real-server-http (STEP 13.57 P3-A real Next.js server)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/p3a-real-server-http.ts

  # ── REQUIRED CHECK: audit-transaction-real (independent job, real status) ──
  # STEP 13.53 Phase F: this check IS in required_status_checks for branch main
  # (alongside verify and phase-tests). A failure blocks merge.
  audit-transaction:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heavix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_test?schema=public"
      STORE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_store_test?schema=public"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-password-not-real"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store/schema.prisma
      - name: Create store test database
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE heavix_store_test;"
      - name: Push schemas
        run: |
          bunx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          bunx prisma db push --accept-data-loss --schema=prisma/store/schema.prisma
      - name: Seed RBAC + catalog
        run: |
          bun run db:seed-rbac
          bun run db:seed-brands-a
          bun run db:seed-brands-b
          bun run db:seed-user-roles
          bun run db:seed-test-fixtures
      - name: audit-transaction-real (real status, no masking)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/audit-transaction-real.ts

  # ── REQUIRED CHECK: Phase tests (independent job, real status) ──
  # STEP 13.53 Phase C (P2-B): seeded by `db:seed-phase-catalog` so phase1..phase9
  # contract tests have the catalog/marketplace/location/moderation/deal/search
  # data they assert against.
  # STEP 13.53 Phase F: this check IS in required_status_checks for branch main
  # (alongside verify and audit-transaction). A failure blocks merge.
  phase-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heavix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_test?schema=public"
      STORE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_store_test?schema=public"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-password-not-real"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store/schema.prisma
      - name: Create store test database
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE heavix_store_test;"
      - name: Push schemas
        run: |
          bunx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          bunx prisma db push --accept-data-loss --schema=prisma/store/schema.prisma
      - name: Seed RBAC + catalog
        run: |
          bun run db:seed-rbac
          bun run db:seed-brands-a
          bun run db:seed-brands-b
          bun run db:seed-user-roles
          bun run db:seed-test-fixtures
      - name: Seed phase catalog (STEP 13.53 P2-B)
        run: bun run db:seed-phase-catalog
      - name: Phase integration tests (real status, no masking)
        run: bunx vitest run tests/phase*.test.ts

  # ── TLS PROOF JOB: Finding D — real TLS behavioral tests ──
  # STEP 15.90: This job provisions TWO TLS-enabled PostgreSQL 17 clusters
  # (valid cert on port 5433, expired cert on port 5434) and runs the
  # real Prisma v6 behavioral TLS suite. It FAILS CLOSED if the TLS
  # infrastructure cannot be provisioned — it never silently skips.
  tls-proof:
    runs-on: ubuntu-latest
    env:
      HEAVIX_TLS_PROOF_RUN: '1'
      HEAVIX_TLS_PG_ROOT: ${{ github.workspace }}/.tls-pg
      HEAVIX_TLS_CERT_DIR: ${{ github.workspace }}/.tls-pg/certs
      HEAVIX_TLS_VALID_PORT: '5433'
      HEAVIX_TLS_EXPIRED_PORT: '5434'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store/schema.prisma
      - name: Provision TLS-enabled PostgreSQL 17
        run: |
          bash scripts/provision-tls-pg.sh
      - name: Verify TLS infrastructure is available (fail-closed)
        run: |
          set -e
          if [ ! -f "$HEAVIX_TLS_PG_ROOT/pg-env.sh" ]; then
            echo "✗ FAIL: TLS infrastructure not provisioned — pg-env.sh missing."
            exit 1
          fi
          if [ ! -f "$HEAVIX_TLS_CERT_DIR/ca-valid.crt" ]; then
            echo "✗ FAIL: TLS infrastructure not provisioned — ca-valid.crt missing."
            exit 1
          fi
          if [ ! -f "$HEAVIX_TLS_CERT_DIR/ca-untrusted.crt" ]; then
            echo "✗ FAIL: TLS infrastructure not provisioned — ca-untrusted.crt missing."
            exit 1
          fi
          if [ ! -f "$HEAVIX_TLS_CERT_DIR/server-valid.crt" ]; then
            echo "✗ FAIL: TLS infrastructure not provisioned — server-valid.crt missing."
            exit 1
          fi
          if [ ! -f "$HEAVIX_TLS_CERT_DIR/server-expired.crt" ]; then
            echo "✗ FAIL: TLS infrastructure not provisioned — server-expired.crt missing."
            exit 1
          fi
          # Verify both clusters are accepting TLS connections
          source "$HEAVIX_TLS_PG_ROOT/pg-env.sh"
          pg_isready -h localhost -p 5433
          pg_isready -h localhost -p 5434
          # Verify the expired cert IS actually expired (fail-closed if not)
          if openssl x509 -in "$HEAVIX_TLS_CERT_DIR/server-expired.crt" -noout -checkend 0 2>/dev/null; then
            echo "✗ FAIL: server-expired.crt is NOT expired — PRISMA-4 would fail."
            exit 1
          fi
          echo "✓ TLS infrastructure verified: both clusters running, expired cert confirmed expired."
      - name: "Run real Prisma v6 TLS behavioral tests (fail-closed: no skips allowed)"
        run: |
          set -e
          # Validate the SAME parser used below against incomplete/non-passing results.
          bash scripts/validate-tls-proof-fail-closed.sh
          # Run tests with verbose reporter first (human-readable diagnostic output).
          echo "── Running TLS behavioral tests (verbose output) ──"
          bunx vitest run tests/integration/rbac-tls-behavioral-real.test.ts --reporter=verbose --silent 2>&1 || true
          echo ""
          echo "── Parsing test results for fail-closed checks ──"
          JSON_FILE=$(mktemp)
          trap 'rm -f "$JSON_FILE"' EXIT
          VITEST_EXIT=0
          # Preserve the real Vitest exit status; a green-looking JSON report cannot mask process failure.
          bunx vitest run tests/integration/rbac-tls-behavioral-real.test.ts --reporter=json --silent --outputFile="$JSON_FILE" 2>/dev/null || VITEST_EXIT=$?
          if [ ! -s "$JSON_FILE" ]; then
            echo "✗ FAIL: vitest JSON output file is empty or missing."
            exit 1
          fi
          # Run the shared parser tested by validate-tls-proof-fail-closed.sh.
          bash scripts/parse-tls-proof-results.sh "$JSON_FILE"
          if [ "$VITEST_EXIT" -ne 0 ]; then
            echo "✗ FAIL: Vitest exited with status $VITEST_EXIT despite producing a parseable result file."
            exit "$VITEST_EXIT"
          fi
      - name: Create isolated TLS preflight database
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}"
          source "$HEAVIX_TLS_PG_ROOT/pg-env.sh"
          psql "host=localhost port=5433 user=$(id -un) dbname=postgres sslmode=verify-full sslrootcert=$HEAVIX_TLS_CERT_DIR/ca-valid.crt" -v ON_ERROR_STOP=1 -c "CREATE DATABASE heavix_preflight_test;"
      - name: Push schema and seed RBAC in isolated TLS database
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql://$(id -un)@localhost:5433/heavix_preflight_test?schema=public&sslmode=require&sslaccept=strict&sslcert=$HEAVIX_TLS_CERT_DIR/ca-valid.crt"
          bunx prisma db push --schema=prisma/schema.prisma
          bun run db:seed-rbac
      - name: Create isolated MISSING-role classification fixture
        run: |
          set -euo pipefail
          export DATABASE_URL="postgresql://$(id -un)@localhost:5433/heavix_preflight_test?schema=public&sslmode=require&sslaccept=strict&sslcert=$HEAVIX_TLS_CERT_DIR/ca-valid.crt"
          bun -e 'import { PrismaClient } from "@prisma/client"; const db = new PrismaClient(); await db.user.create({ data: { firstName: "CI", lastName: "Preflight", email: "phase-c-preflight@example.invalid", mobile: "+19999999999", passwordHash: "not-a-real-password", role: "BUYER", status: "ACTIVE" } }); await db.$disconnect();'
      - name: Grant least-privilege access for TLS preflight
        run: |
          set -euo pipefail
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}"
          source "$HEAVIX_TLS_PG_ROOT/pg-env.sh"
          psql "host=localhost port=5433 user=$(id -un) dbname=heavix_preflight_test sslmode=verify-full sslrootcert=$HEAVIX_TLS_CERT_DIR/ca-valid.crt" -v ON_ERROR_STOP=1 <<'SQL'
          GRANT CONNECT ON DATABASE heavix_preflight_test TO heavix_dryrun_ro;
          GRANT USAGE ON SCHEMA public TO heavix_dryrun_ro;
          GRANT SELECT ON ALL TABLES IN SCHEMA public TO heavix_dryrun_ro;
          REVOKE INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON ALL TABLES IN SCHEMA public FROM heavix_dryrun_ro;
          REVOKE ALL ON ALL SEQUENCES IN SCHEMA public FROM heavix_dryrun_ro;
          GRANT SELECT ON ALL SEQUENCES IN SCHEMA public TO heavix_dryrun_ro;
          REVOKE CREATE ON SCHEMA public FROM heavix_dryrun_ro;
          REVOKE CREATE ON DATABASE heavix_preflight_test FROM heavix_dryrun_ro;
          SQL
      - name: Run Phase C read-only preflight gate against TLS PostgreSQL 17
        env:
          DATABASE_URL: "postgresql://heavix_dryrun_ro:readonly_pass@localhost:5433/heavix_preflight_test?schema=public&sslmode=require&sslaccept=strict&sslcert=${{ github.workspace }}/.tls-pg/certs/ca-valid.crt"
          DRYRUN_CONFIRM_TARGET: "heavix_preflight_test"
          DRYRUN_EXPECTED_HOST: "localhost"
          DRYRUN_EXPECTED_ROLE: "heavix_dryrun_ro"
        run: |
          set -euo pipefail
          OUTPUT_FILE=$(mktemp)
          trap 'rm -f "$OUTPUT_FILE"' EXIT
          bunx tsx scripts/rbac-gate-ci.ts 2>&1 | tee "$OUTPUT_FILE"
          grep -Fq '"safeToBackfillCount":1' "$OUTPUT_FILE" || { echo "FAIL: expected exactly one MISSING user in the disposable fixture."; exit 1; }
          grep -Fq '"total":1' "$OUTPUT_FILE" || { echo "FAIL: expected the gate to classify exactly one fixture user."; exit 1; }

  # ── DOCKER BUILD PROOF: verify Dockerfile produces a valid image ──
  # F-01 regression guard: proves the Prisma schema paths in Dockerfile
  # are correct and the image builds without errors.
  docker-build-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store/schema.prisma
      - name: Build Docker image
        run: docker build -t heavix-test-image .
      - name: Verify image was created
        run: docker image inspect heavix-test-image --format '{{.Id}}' > /dev/null && echo "✓ Docker image built successfully"

      - name: Validate Caddyfile syntax
        run: docker run --rm -e HEAVIX_DOMAIN=test.heavix.example.com -v $(pwd)/Caddyfile:/etc/caddy/Caddyfile caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Validate docker-compose.prod.yml config with exact interpolation
        env:
          DB_PASSWORD: test-password-not-real
          HEAVIX_DOMAIN: test.heavix.example.com
        run: |
          printf 'DB_PASSWORD=test-password-not-real\nHEAVIX_DOMAIN=test.heavix.example.com\n' > .env.production
          RENDERED=$(docker compose --env-file .env.production -f docker-compose.prod.yml config)
          rm -f .env.production
          # 1. Assert caddy service has HEAVIX_DOMAIN = test.heavix.example.com
          # Extract caddy service block (from 'caddy:' to next top-level service)
          CADDY_BLOCK=$(echo "$RENDERED" | awk '/^  caddy:/{f=1} f{print} /^  [a-z]/&&!/^  caddy:/{if(f)exit}')
          if ! echo "$CADDY_BLOCK" | grep -q 'HEAVIX_DOMAIN: test.heavix.example.com'; then
            echo "FAIL: caddy service does not have HEAVIX_DOMAIN=test.heavix.example.com"
            exit 1
          fi
          echo "caddy HEAVIX_DOMAIN verified"
          # 2. Assert app service has HEAVIX_DOMAIN = test.heavix.example.com
          APP_BLOCK=$(echo "$RENDERED" | awk '/^  app:/{f=1} f{print} /^  [a-z]/&&!/^  app:/{if(f)exit}')
          if ! echo "$APP_BLOCK" | grep -q 'HEAVIX_DOMAIN: test.heavix.example.com'; then
            echo "FAIL: app service does not have HEAVIX_DOMAIN=test.heavix.example.com"
            exit 1
          fi
          echo "app HEAVIX_DOMAIN verified"
          # 3. Assert DATABASE_URL contains the test password (interpolated, not raw)
          echo "$RENDERED" | grep -q 'postgresql://heavix:test-password-not-real@db:5432/heavix' \
            || { echo "FAIL: DATABASE_URL does not contain interpolated test password"; exit 1; }
          echo "DATABASE_URL interpolation verified"
          # 4. Assert STORE_DATABASE_URL contains the test password (interpolated, not raw)
          echo "$RENDERED" | grep -q 'postgresql://heavix:test-password-not-real@store-db:5432/heavix_store' \
            || { echo "FAIL: STORE_DATABASE_URL does not contain interpolated test password"; exit 1; }
          echo "STORE_DATABASE_URL interpolation verified"
          # 5. Assert no raw placeholders remain anywhere
          if echo "$RENDERED" | grep -q '${DB_PASSWORD}'; then
            echo "FAIL: raw \${DB_PASSWORD} placeholder found in rendered config"
            exit 1
          fi
          if echo "$RENDERED" | grep -q '${HEAVIX_DOMAIN}'; then
            echo "FAIL: raw \${HEAVIX_DOMAIN} placeholder found in rendered config"
            exit 1
          fi
          echo "All interpolation values verified exactly"

      - name: "Test real Caddy→app connectivity in Docker Compose (fail-closed)"
        env:
          DB_PASSWORD: test-password-not-real
          HEAVIX_DOMAIN: test.heavix.example.com
        run: |
          set -euo pipefail
          cleanup() {
            docker compose -f docker-compose.prod.yml down || true
            rm -f .env.production
            mv Caddyfile.prod Caddyfile 2>/dev/null || true
          }
          trap cleanup EXIT
          printf 'DB_PASSWORD=test-password-not-real\nHEAVIX_DOMAIN=test.heavix.example.com\n' > .env.production
          # Use test Caddyfile (no real TLS) for connectivity test
          cp Caddyfile Caddyfile.prod
          cp Caddyfile.test Caddyfile
          docker compose --env-file .env.production -f docker-compose.prod.yml up -d
          sleep 20

          # Verify the runtime image can perform a paired PostgreSQL backup.
          # These databases are disposable CI containers; no valuable data is used.
          docker compose exec -T app sh -ec 'command -v bash; command -v pg_dump; test -x /app/scripts/backup.sh; test -w /app/backups'
          docker compose exec -T \
            -e DB_HOST=db -e DB_PORT=5432 -e DB_USER=heavix -e DB_NAME=heavix -e DB_PASSWORD=test-password-not-real \
            -e STORE_DB_HOST=store-db -e STORE_DB_PORT=5432 -e STORE_DB_USER=heavix -e STORE_DB_NAME=heavix_store -e STORE_DB_PASSWORD=test-password-not-real \
            app bash /app/scripts/backup.sh
          docker compose exec -T app sh -ec 'latest=$(find /app/backups -mindepth 1 -maxdepth 1 -type d ! -name ".*" | sort | tail -n 1); test -n "$latest"; test -s "$latest/main.sql"; test -s "$latest/store.sql"; (cd "$latest" && sha256sum -c checksums.txt)'

          # Test THROUGH Caddy → app:3000 → /api/health
          # Must get HTTP 200 — NOT 308 (redirect only), NOT 502/503 (upstream down)
          HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:80/api/health || true)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "FAIL: Expected HTTP 200 from Caddy→app /api/health, got $HTTP_CODE"
            docker compose -f docker-compose.prod.yml logs caddy
            docker compose -f docker-compose.prod.yml logs app
            exit 1
          fi
          echo "SUCCESS: Caddy→app connectivity proven (HTTP 200 from /api/health)"

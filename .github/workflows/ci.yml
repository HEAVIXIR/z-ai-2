# HEAVIX — CI Pipeline
# Runs on cloudflare-migration branch and PRs to main.
# Pipeline: install → lint → typecheck → prisma generate → build

name: CI

on:
  push:
    branches: [cloudflare-migration]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint → Typecheck → Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Generate Prisma Client
        run: bunx prisma generate --schema=prisma/schema.prisma

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:/tmp/test.db"
          NODE_ENV: "production"
          NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
          NEXT_PUBLIC_SITE_URL: "http://localhost:3000"
          ADMIN_USERNAME: "admin"
          ADMIN_PASSWORD: "ci-placeholder"
          CRON_SECRET: "ci-placeholder"
          DEV_AUTH_CODES: ""
          NEXTAUTH_URL: "http://localhost:3000"
          SMTP_FROM: ""
          SMTP_HOST: ""
          SMTP_PASS: ""
          SMTP_PORT: ""
          SMTP_USER: ""
          TELEGRAM_BOT_TOKEN: ""
          TELEGRAM_DEFAULT_CHAT_ID: ""
          ZARINPAL_MERCHANT_ID: ""
          STORE_DATABASE_URL: "file:/tmp/store-test.db"

      - name: vinext check
        run: npx vinext check
        continue-on-error: true

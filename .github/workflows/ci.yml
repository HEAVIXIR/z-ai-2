name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

jobs:
  # ── BLOCKING job: all required security/contract/integration/build tests ──
  # Any failure fails the workflow and blocks merge.
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heavix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_test?schema=public"
      STORE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_store_test?schema=public"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-password-not-real"

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store-schema.prisma
      - name: Create store test database
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE heavix_store_test;"
      - name: Push schemas
        run: |
          bunx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          bunx prisma db push --accept-data-loss --schema=prisma/store-schema.prisma
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Seed RBAC
        run: bun run db:seed-rbac
      - name: Seed catalog data
        run: |
          bun run db:seed-brands-a
          bun run db:seed-brands-b
          bun run db:seed-user-roles
          bun run db:seed-test-fixtures
      - name: Create read-only PostgreSQL role (STEP 15.51)
        run: |
          # CR-15.51-04: Generate random password, never hard-coded
          DRYUN_RO_PW=$(openssl rand -hex 16)
          echo "DRYUN_RO_PW=$DRYUN_RO_PW" >> $GITHUB_ENV
          # CR-15.51-04: Pass password as psql variable (not SQL current_setting)
          PGPASSWORD=postgres psql -h localhost -U postgres -d heavix_test \
            -v dryrun_password="$DRYUN_RO_PW" \
            -f scripts/rbac-create-readonly-role.sql
      - name: Security tests
        run: bun run test:security
      - name: Phase C dry-run gate (STEP 15.88 — requires TLS, SKIPPED in CI without TLS)
        env:
          # STEP 15.88: Prisma v6 requires sslmode=require, sslaccept=strict, and an explicit sslcert CA path.
          # CI postgres:17 does NOT have TLS configured. The preflight will halt because the CI URL lacks strict TLS settings. The
          # CI PostgreSQL service does not offer TLS or a configured trusted CA.
          #
          # INFRASTRUCTURE DEPENDENCY: a TLS-enabled PostgreSQL server is
          # required to run the dry-run gate in CI. This is NOT available
          # in the current postgres:17 Docker container.
          #
          # Finding D remains OPEN/UNVERIFIED until:
          # 1. A TLS-enabled PostgreSQL server is configured in CI
          # 2. The preflight's strict Prisma TLS settings are present and the real connection rejects invalid certificates
          # 3. Actual TLS handshake validation (CA + hostname) is proven
          #
          # For now, the gate step is SKIPPED. The dry-run script is still
          # tested via unit tests (which verify the sslmode CHECK logic).
          DRYRUN_DATABASE_URL: postgresql://heavix_dryrun_ro:${{ env.DRYUN_RO_PW }}@localhost:5432/heavix_test?schema=public
          DRYRUN_CONFIRM_TARGET: heavix_test
          DRYRUN_EXPECTED_ROLE: heavix_dryrun_ro
          DRYRUN_EXPECTED_HOST: localhost
        run: |
          echo "── STEP 15.88: Dry-run gate SKIPPED — CI postgres:17 does not have TLS."
          echo "   Prisma v6 requires sslmode=require, sslaccept=strict, and an explicit sslcert CA path."
          echo "   The CI postgres:17 container does not offer TLS connections."
          echo "   Finding D remains OPEN/UNVERIFIED until TLS infrastructure is deployed."
          echo "   Unit tests verify the strict TLS configuration gate; no handshake is claimed."
          echo "── Gate step skipped."
      - name: Integration — tenant-scope-real
        run: bunx tsx tests/integration/tenant-scope-real.ts
      - name: Integration — readonly-when-concurrency-real
        run: bunx tsx tests/integration/readonly-when-concurrency-real.ts
      - name: Integration — payment-concurrency-real
        run: bunx tsx tests/integration/payment-concurrency-real.ts
      - name: Integration — deal-concurrency-real (STEP 13.36 P2-A)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/deal-concurrency-real.ts
      - name: Integration — p3a-http-db-real (STEP 13.54 Phase 2 P3-A)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/p3a-http-db-real.ts
      - name: Integration — p3a-auth-real-http-db (STEP 13.55 Commit B P3-A)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/p3a-auth-real-http-db.ts
      - name: Integration test files
        env:
          DRYUN_RO_PW: ${{ env.DRYUN_RO_PW }}
        run: bunx vitest run tests/integration/*.test.ts
      - name: All contract + unit tests
        run: bunx vitest run tests/contract/ tests/unit/
      - name: E2E smoke tests
        run: bunx vitest run tests/e2e/
      - name: Production build
        run: bun run build
      - name: Integration — p3a-real-server-http (STEP 13.57 P3-A real Next.js server)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/p3a-real-server-http.ts

  # ── REQUIRED CHECK: audit-transaction-real (independent job, real status) ──
  # STEP 13.53 Phase F: this check IS in required_status_checks for branch main
  # (alongside verify and phase-tests). A failure blocks merge.
  audit-transaction:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heavix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_test?schema=public"
      STORE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_store_test?schema=public"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-password-not-real"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store-schema.prisma
      - name: Create store test database
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE heavix_store_test;"
      - name: Push schemas
        run: |
          bunx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          bunx prisma db push --accept-data-loss --schema=prisma/store-schema.prisma
      - name: Seed RBAC + catalog
        run: |
          bun run db:seed-rbac
          bun run db:seed-brands-a
          bun run db:seed-brands-b
          bun run db:seed-user-roles
          bun run db:seed-test-fixtures
      - name: audit-transaction-real (real status, no masking)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/audit-transaction-real.ts

  # ── REQUIRED CHECK: Phase tests (independent job, real status) ──
  # STEP 13.53 Phase C (P2-B): seeded by `db:seed-phase-catalog` so phase1..phase9
  # contract tests have the catalog/marketplace/location/moderation/deal/search
  # data they assert against.
  # STEP 13.53 Phase F: this check IS in required_status_checks for branch main
  # (alongside verify and audit-transaction). A failure blocks merge.
  phase-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heavix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_test?schema=public"
      STORE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_store_test?schema=public"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-password-not-real"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store-schema.prisma
      - name: Create store test database
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE heavix_store_test;"
      - name: Push schemas
        run: |
          bunx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          bunx prisma db push --accept-data-loss --schema=prisma/store-schema.prisma
      - name: Seed RBAC + catalog
        run: |
          bun run db:seed-rbac
          bun run db:seed-brands-a
          bun run db:seed-brands-b
          bun run db:seed-user-roles
          bun run db:seed-test-fixtures
      - name: Seed phase catalog (STEP 13.53 P2-B)
        run: bun run db:seed-phase-catalog
      - name: Phase integration tests (real status, no masking)
        run: bunx vitest run tests/phase*.test.ts

  # ── TLS PROOF JOB: Finding D — real TLS behavioral tests ──
  # STEP 15.90: This job provisions TWO TLS-enabled PostgreSQL 17 clusters
  # (valid cert on port 5433, expired cert on port 5434) and runs the
  # real Prisma v6 behavioral TLS suite. It FAILS CLOSED if the TLS
  # infrastructure cannot be provisioned — it never silently skips.
  tls-proof:
    runs-on: ubuntu-latest
    env:
      HEAVIX_TLS_PROOF_RUN: '1'
      HEAVIX_TLS_PG_ROOT: ${{ github.workspace }}/.tls-pg
      HEAVIX_TLS_CERT_DIR: ${{ github.workspace }}/.tls-pg/certs
      HEAVIX_TLS_VALID_PORT: '5433'
      HEAVIX_TLS_EXPIRED_PORT: '5434'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store-schema.prisma
      - name: Provision TLS-enabled PostgreSQL 17
        run: |
          bash scripts/provision-tls-pg.sh
      - name: Verify TLS infrastructure is available (fail-closed)
        run: |
          set -e
          if [ ! -f "$HEAVIX_TLS_PG_ROOT/pg-env.sh" ]; then
            echo "✗ FAIL: TLS infrastructure not provisioned — pg-env.sh missing."
            exit 1
          fi
          if [ ! -f "$HEAVIX_TLS_CERT_DIR/ca-valid.crt" ]; then
            echo "✗ FAIL: TLS infrastructure not provisioned — ca-valid.crt missing."
            exit 1
          fi
          if [ ! -f "$HEAVIX_TLS_CERT_DIR/ca-untrusted.crt" ]; then
            echo "✗ FAIL: TLS infrastructure not provisioned — ca-untrusted.crt missing."
            exit 1
          fi
          if [ ! -f "$HEAVIX_TLS_CERT_DIR/server-valid.crt" ]; then
            echo "✗ FAIL: TLS infrastructure not provisioned — server-valid.crt missing."
            exit 1
          fi
          if [ ! -f "$HEAVIX_TLS_CERT_DIR/server-expired.crt" ]; then
            echo "✗ FAIL: TLS infrastructure not provisioned — server-expired.crt missing."
            exit 1
          fi
          # Verify both clusters are accepting TLS connections
          source "$HEAVIX_TLS_PG_ROOT/pg-env.sh"
          pg_isready -h localhost -p 5433
          pg_isready -h localhost -p 5434
          # Verify the expired cert IS actually expired (fail-closed if not)
          if openssl x509 -in "$HEAVIX_TLS_CERT_DIR/server-expired.crt" -noout -checkend 0 2>/dev/null; then
            echo "✗ FAIL: server-expired.crt is NOT expired — PRISMA-4 would fail."
            exit 1
          fi
          echo "✓ TLS infrastructure verified: both clusters running, expired cert confirmed expired."
      - name: "Run real Prisma v6 TLS behavioral tests (fail-closed: no skips allowed)"
        run: |
          set -e
          # Run tests with verbose reporter first (for human-readable CI log)
          echo "── Running TLS behavioral tests (verbose output) ──"
          bunx vitest run tests/integration/rbac-tls-behavioral-real.test.ts --reporter=verbose --silent 2>&1 || true
          echo ""
          echo "── Parsing test results for fail-closed checks ──"
          # Run again with JSON reporter, --silent suppresses console.log/warn from tests
          # so stdout contains ONLY valid JSON. stderr goes to a separate file.
          JSON_FILE=$(mktemp)
          STDERR_FILE=$(mktemp)
          bunx vitest run tests/integration/rbac-tls-behavioral-real.test.ts --reporter=json --silent > "$JSON_FILE" 2> "$STDERR_FILE" || true
          # Show stderr (vitest's own messages, not test console output)
          echo "── vitest stderr ──"
          cat "$STDERR_FILE" 2>/dev/null || true
          # Validate JSON is parseable
          if ! jq empty "$JSON_FILE" 2>/dev/null; then
            echo "✗ FAIL: vitest JSON output is not valid JSON."
            echo "  First 500 chars of output:"
            head -c 500 "$JSON_FILE" || true
            echo ""
            echo "  This usually means console.log/warn from tests corrupted the JSON."
            echo "  Ensure --silent is passed to vitest."
            exit 1
          fi
          # Parse results
          SKIP_COUNT=$(jq '[.testResults[].assertionResults[]? | select(.status == "skipped")] | length' "$JSON_FILE")
          RUN_COUNT=$(jq '[.testResults[].assertionResults[]? | select(.status != "skipped")] | length' "$JSON_FILE")
          PASS_COUNT=$(jq '[.testResults[].assertionResults[]? | select(.status == "passed")] | length' "$JSON_FILE")
          FAIL_COUNT=$(jq '[.testResults[].assertionResults[]? | select(.status == "failed")] | length' "$JSON_FILE")
          echo ""
          echo "── TLS Proof Test Summary ──"
          echo "  Total run (non-skipped): $RUN_COUNT"
          echo "  Passed: $PASS_COUNT"
          echo "  Failed: $FAIL_COUNT"
          echo "  Skipped: $SKIP_COUNT"
          # Fail-closed: no skips allowed
          if [ "$SKIP_COUNT" != "0" ]; then
            echo ""
            echo "✗ FAIL: $SKIP_COUNT tests were SKIPPED — TLS infrastructure was not fully available."
            echo "  The TLS proof job must NEVER have skipped tests."
            exit 1
          fi
          # Fail-closed: must run at least 13 tests (7 Prisma + 5 libpq + 1 verdict)
          if [ "$RUN_COUNT" -lt 13 ]; then
            echo ""
            echo "✗ FAIL: Only $RUN_COUNT tests ran — expected at least 13."
            exit 1
          fi
          # Fail-closed: no failures allowed
          if [ "$FAIL_COUNT" != "0" ]; then
            echo ""
            echo "✗ FAIL: $FAIL_COUNT tests FAILED — TLS behavioral tests did not pass."
            exit 1
          fi
          echo ""
          echo "✓ All $RUN_COUNT TLS behavioral tests ran with 0 skips and 0 failures."
          rm -f "$JSON_FILE" "$STDERR_FILE"

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heavix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_test?schema=public"
      STORE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_store_test?schema=public"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-password-not-real"

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store-schema.prisma

      - name: Create store test database
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE heavix_store_test;"

      - name: Push schemas
        run: |
          bunx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          bunx prisma db push --accept-data-loss --schema=prisma/store-schema.prisma

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Seed RBAC (roles + permissions for integration tests)
        run: bun run db:seed-rbac

      - name: Seed catalog data (brands + test fixtures for contract/phase tests)
        run: |
          bun run db:seed-brands-a
          bun run db:seed-brands-b
          bun run db:seed-test-fixtures || true

      - name: Security tests
        run: bun run test:security

      - name: Integration tests (real PostgreSQL — PR-SC-00 tenant-scoping negative tests)
        run: bunx tsx tests/integration/tenant-scope-real.ts

      - name: All contract + unit tests (STEP 13.31 P2-B — expanded to all 26 contract files)
        run: bunx vitest run tests/contract/ tests/unit/

      - name: Integration test files (real PostgreSQL)
        run: bunx vitest run tests/integration/*.test.ts

      - name: Phase integration tests (real PostgreSQL — informational, needs full catalog seed)
        continue-on-error: true
        run: bunx vitest run tests/phase*.test.ts

      - name: E2E smoke tests (informational)
        continue-on-error: true
        run: bunx vitest run tests/e2e/

      - name: Production build
        run: bun run build

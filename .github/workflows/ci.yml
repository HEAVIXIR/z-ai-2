name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**']

jobs:
  # ── BLOCKING job: all required security/contract/integration/build tests ──
  # Any failure fails the workflow and blocks merge.
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heavix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_test?schema=public"
      STORE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_store_test?schema=public"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-password-not-real"

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store-schema.prisma
      - name: Create store test database
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE heavix_store_test;"
      - name: Push schemas
        run: |
          bunx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          bunx prisma db push --accept-data-loss --schema=prisma/store-schema.prisma
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Seed RBAC
        run: bun run db:seed-rbac
      - name: Seed catalog data
        run: |
          bun run db:seed-brands-a
          bun run db:seed-brands-b
          bun run db:seed-user-roles
          bun run db:seed-test-fixtures
      - name: Security tests
        run: bun run test:security
      - name: Integration — tenant-scope-real
        run: bunx tsx tests/integration/tenant-scope-real.ts
      - name: Integration — readonly-when-concurrency-real
        run: bunx tsx tests/integration/readonly-when-concurrency-real.ts
      - name: Integration — payment-concurrency-real
        run: bunx tsx tests/integration/payment-concurrency-real.ts
      - name: Integration — deal-concurrency-real (STEP 13.36 P2-A)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/deal-concurrency-real.ts
      - name: Integration test files
        run: bunx vitest run tests/integration/*.test.ts
      - name: All contract + unit tests
        run: bunx vitest run tests/contract/ tests/unit/
      - name: E2E smoke tests
        run: bunx vitest run tests/e2e/
      - name: Production build
        run: bun run build

  # ── INFORMATIONAL: audit-transaction-real (independent job, real status) ──
  # Pre-existing failure in scenario 4. Shows REAL failure status.
  # NOT in required_status_checks — does not block merge.
  audit-transaction:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heavix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_test?schema=public"
      STORE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_store_test?schema=public"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-password-not-real"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store-schema.prisma
      - name: Create store test database
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE heavix_store_test;"
      - name: Push schemas
        run: |
          bunx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          bunx prisma db push --accept-data-loss --schema=prisma/store-schema.prisma
      - name: Seed RBAC + catalog
        run: |
          bun run db:seed-rbac
          bun run db:seed-brands-a
          bun run db:seed-brands-b
          bun run db:seed-user-roles
          bun run db:seed-test-fixtures
      - name: audit-transaction-real (real status, no masking)
        run: bunx vitest run --config vitest.integration.config.ts tests/integration/audit-transaction-real.ts

  # ── INFORMATIONAL: Phase tests (independent job, real status) ──
  # 75 of 734 tests fail on missing comprehensive seed infrastructure.
  # Shows REAL failure status. NOT in required_status_checks.
  phase-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: heavix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_test?schema=public"
      STORE_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/heavix_store_test?schema=public"
      ADMIN_USERNAME: "ci-admin"
      ADMIN_PASSWORD: "ci-password-not-real"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Generate Prisma clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store-schema.prisma
      - name: Create store test database
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE heavix_store_test;"
      - name: Push schemas
        run: |
          bunx prisma db push --accept-data-loss --schema=prisma/schema.prisma
          bunx prisma db push --accept-data-loss --schema=prisma/store-schema.prisma
      - name: Seed RBAC + catalog
        run: |
          bun run db:seed-rbac
          bun run db:seed-brands-a
          bun run db:seed-brands-b
          bun run db:seed-user-roles
          bun run db:seed-test-fixtures
      - name: Phase integration tests (real status, no masking)
        run: bunx vitest run tests/phase*.test.ts

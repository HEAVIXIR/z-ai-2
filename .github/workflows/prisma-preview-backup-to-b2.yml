name: HEAVIX Preview paired encrypted B2 backup

on:
  workflow_dispatch:
    inputs:
      target:
        description: Dedicated Preview databases only
        required: true
        type: choice
        options: [PREVIEW_ONLY]
      confirm:
        description: Type BACKUP_PREVIEW_ONLY
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: heavix-preview-paired-b2-backup
  cancel-in-progress: false

jobs:
  paired-backup:
    if: github.ref == 'refs/heads/security/active-session-hardening-2026-11-08'
    environment: preview-backup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      restore-db:
        image: postgres:17
        env:
          POSTGRES_USER: restore
          POSTGRES_PASSWORD: local-restore-only
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U restore -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Enforce branch, commit and explicit Preview confirmation
        shell: bash
        env:
          DISPATCH_TARGET: ${{ inputs.target }}
          DISPATCH_CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/security/active-session-hardening-2026-11-08"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$DISPATCH_TARGET" = "PREVIEW_ONLY"
          test "$DISPATCH_CONFIRM" = "BACKUP_PREVIEW_ONLY"
          echo "Preview-only dispatch gates passed."

      - name: Install age and AWS CLI
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes age awscli

      - name: Validate protected environment values
        shell: bash
        env:
          MAIN_PREVIEW_DATABASE_URL: ${{ secrets.MAIN_PREVIEW_DATABASE_URL }}
          STORE_PREVIEW_DATABASE_URL: ${{ secrets.STORE_PREVIEW_DATABASE_URL }}
          B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
          AGE_IDENTITY: ${{ secrets.AGE_IDENTITY }}
        run: |
          set -uo pipefail
          failures=0
          pass() { echo "PASS: $1"; }
          fail() { echo "FAIL: $1"; failures=$((failures + 1)); }
          check_present() {
            local label="$1" value="$2"
            if [ -n "$value" ]; then pass "$label"; else fail "$label"; fi
          }
          check_equal() {
            local label="$1" actual="$2" expected="$3"
            if [ "$actual" = "$expected" ]; then pass "$label"; else fail "$label"; fi
          }

          check_present "MAIN_PREVIEW_DATABASE_URL_PRESENT" "$MAIN_PREVIEW_DATABASE_URL"
          check_present "STORE_PREVIEW_DATABASE_URL_PRESENT" "$STORE_PREVIEW_DATABASE_URL"
          if [ -n "$MAIN_PREVIEW_DATABASE_URL" ] && [ -n "$STORE_PREVIEW_DATABASE_URL" ]; then
            if [ "$MAIN_PREVIEW_DATABASE_URL" != "$STORE_PREVIEW_DATABASE_URL" ]; then
              pass "PREVIEW_DATABASE_URLS_ARE_DISTINCT"
            else
              fail "PREVIEW_DATABASE_URLS_ARE_DISTINCT"
            fi
          else
            echo "SKIP: PREVIEW_DATABASE_URLS_ARE_DISTINCT (one or both URLs missing)"
          fi

          check_equal "B2_S3_ENDPOINT_EXPECTED" "$B2_S3_ENDPOINT" "s3.us-east-005.backblazeb2.com"
          check_equal "B2_BUCKET_EXPECTED" "$B2_BUCKET" "heavix-db-backups"
          check_present "B2_APPLICATION_KEY_ID_PRESENT" "$B2_APPLICATION_KEY_ID"
          check_present "B2_APPLICATION_KEY_PRESENT" "$B2_APPLICATION_KEY"
          check_present "AGE_RECIPIENT_PRESENT" "$AGE_RECIPIENT"
          check_present "AGE_IDENTITY_PRESENT" "$AGE_IDENTITY"

          identity_file="$RUNNER_TEMP/age-identity-preflight.txt"
          trap 'rm -f "$identity_file"' EXIT
          if [ -n "$AGE_IDENTITY" ] && [ -n "$AGE_RECIPIENT" ]; then
            printf '%s\n' "$AGE_IDENTITY" > "$identity_file"
            chmod 600 "$identity_file"
            if derived_recipient="$(age-keygen -y "$identity_file" 2>/dev/null)"; then
              if [ "$derived_recipient" = "$AGE_RECIPIENT" ]; then
                pass "AGE_KEYPAIR_MATCH"
              else
                fail "AGE_KEYPAIR_MATCH"
              fi
            else
              fail "AGE_IDENTITY_PARSE"
            fi
          else
            echo "SKIP: AGE_KEYPAIR_MATCH (recipient or identity missing)"
          fi

          if [ "$failures" -ne 0 ]; then
            echo "Protected environment validation failed: $failures check(s). Secret values were not printed."
            exit 1
          fi
          echo "All protected environment validation checks passed; secret values redacted."

      - name: Verify Preview resource IDs, TLS and enforced read-only backup sessions
        shell: bash
        env:
          MAIN_PREVIEW_DATABASE_URL: ${{ secrets.MAIN_PREVIEW_DATABASE_URL }}
          STORE_PREVIEW_DATABASE_URL: ${{ secrets.STORE_PREVIEW_DATABASE_URL }}
        run: |
          set -euo pipefail
          CID="$(docker ps --filter "ancestor=postgres:17" --format '{{.ID}}' | head -n1)"
          test -n "$CID"
          SQL="SELECT current_setting('transaction_read_only') = 'on' AND current_setting('default_transaction_read_only') = 'on' AND NOT r.rolsuper AND NOT r.rolcreatedb AND NOT r.rolcreaterole AND NOT r.rolbypassrls AND NOT has_database_privilege(current_user,current_database(),'CREATE') AND NOT EXISTS (SELECT 1 FROM pg_namespace n WHERE n.nspname NOT IN ('pg_catalog','information_schema') AND (has_schema_privilege(current_user,n.oid,'CREATE') OR NOT has_schema_privilege(current_user,n.oid,'USAGE'))) AND NOT EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind IN ('r','p','v','m','f') AND n.nspname NOT IN ('pg_catalog','information_schema') AND NOT has_table_privilege(current_user,c.oid,'SELECT')) AND NOT EXISTS (SELECT 1 FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE c.relkind='S' AND n.nspname NOT IN ('pg_catalog','information_schema') AND NOT has_sequence_privilege(current_user,c.oid,'SELECT')) FROM pg_roles r WHERE r.rolname=current_user"
          verify_db() {
            label="$1"; url="$2"; expected="$3"
            control_sql="SELECT has_function_privilege(current_user, 'pg_catalog.pg_control_system()', 'EXECUTE')"
            control_access="$(docker exec -e DB_URL="$url" -e CONTROL_SQL="$control_sql" -e PGSSLMODE=verify-full -e PGOPTIONS='-c default_transaction_read_only=on' "$CID" bash -ceu 'psql "$DB_URL" -XAtq -v ON_ERROR_STOP=1 -c "$CONTROL_SQL"')"
            test "$control_access" = "t" || { echo "$label role cannot execute pg_control_system(); Preview identity check blocked."; return 1; }
            actual="$(docker exec -e DB_URL="$url" -e PGSSLMODE=verify-full -e PGOPTIONS='-c default_transaction_read_only=on' "$CID" bash -ceu 'psql "$DB_URL" -XAtq -v ON_ERROR_STOP=1 -c "SELECT system_identifier FROM pg_control_system()"')"
            test "$actual" = "$expected" || { echo "$label Preview identity mismatch."; return 1; }
            safe="$(docker exec -e DB_URL="$url" -e SQL="$SQL" -e PGSSLMODE=verify-full -e PGOPTIONS='-c default_transaction_read_only=on' "$CID" bash -ceu 'psql "$DB_URL" -XAtq -v ON_ERROR_STOP=1 -c "$SQL"')"
            test "$safe" = "t" || { echo "$label role is not proven least-privilege/read-only. Backup blocked."; return 1; }
            echo "$label Preview identity, TLS and enforced read-only session checks passed."
          }
          verify_db Main "$MAIN_PREVIEW_DATABASE_URL" 7701427422680793119
          verify_db Store "$STORE_PREVIEW_DATABASE_URL" 7701425043360235551

      - name: Dump both databases, encrypt and create manifest
        shell: bash
        env:
          MAIN_PREVIEW_DATABASE_URL: ${{ secrets.MAIN_PREVIEW_DATABASE_URL }}
          STORE_PREVIEW_DATABASE_URL: ${{ secrets.STORE_PREVIEW_DATABASE_URL }}
          AGE_RECIPIENT: ${{ secrets.AGE_RECIPIENT }}
        run: |
          set -euo pipefail
          umask 077
          echo "Prisma Postgres credentials are full-access; dump connections are forced into read-only sessions."
          CID="$(docker ps --filter "ancestor=postgres:17" --format '{{.ID}}' | head -n1)"
          WORK="$RUNNER_TEMP/heavix-b2"
          mkdir -m 700 -p "$WORK"
          for name in main store; do
            if [ "$name" = "main" ]; then url="$MAIN_PREVIEW_DATABASE_URL"; else url="$STORE_PREVIEW_DATABASE_URL"; fi
            docker exec -e DB_URL="$url" -e PGSSLMODE=verify-full -e PGOPTIONS='-c default_transaction_read_only=on' "$CID" bash -ceu 'pg_dump --serializable-deferrable --format=custom --no-owner --no-acl --dbname="$DB_URL" > /tmp/'"$name"'.dump'
            docker cp "$CID:/tmp/$name.dump" "$WORK/$name.dump"
            test -s "$WORK/$name.dump"
          done
          cd "$WORK"
          sha256sum main.dump store.dump > SHA256SUMS
          {
            echo "format=heavix-preview-paired-backup-v1"
            echo "created_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "main_system_identifier=7701427422680793119"
            echo "store_system_identifier=7701425043360235551"
            echo "postgres_major=17"
            echo "main_bytes=$(wc -c < main.dump)"
            echo "store_bytes=$(wc -c < store.dump)"
            cat SHA256SUMS
          } > manifest.txt
          age -r "$AGE_RECIPIENT" -o main.dump.age main.dump
          age -r "$AGE_RECIPIENT" -o store.dump.age store.dump
          age -r "$AGE_RECIPIENT" -o manifest.txt.age manifest.txt
          sha256sum main.dump.age store.dump.age manifest.txt.age > ENCRYPTED_SHA256SUMS
          rm -f main.dump store.dump manifest.txt

      - name: Upload encrypted objects and verify B2 read-back
        shell: bash
        env:
          B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          AWS_REGION: us-east-005
          AWS_DEFAULT_REGION: us-east-005
          AWS_EC2_METADATA_DISABLED: "true"
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/heavix-b2"
          PREFIX="preview/paired/$(date -u +%Y/%m/%d)/$GITHUB_SHA/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          export AWS_ACCESS_KEY_ID="$B2_APPLICATION_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$B2_APPLICATION_KEY"
          ENDPOINT="https://$B2_S3_ENDPOINT"
          for file in main.dump.age store.dump.age manifest.txt.age ENCRYPTED_SHA256SUMS; do
            aws --endpoint-url "$ENDPOINT" s3 cp "$WORK/$file" "s3://$B2_BUCKET/$PREFIX/$file" --only-show-errors
          done
          mkdir -m 700 "$WORK/readback"
          for file in main.dump.age store.dump.age manifest.txt.age ENCRYPTED_SHA256SUMS; do
            aws --endpoint-url "$ENDPOINT" s3 cp "s3://$B2_BUCKET/$PREFIX/$file" "$WORK/readback/$file" --only-show-errors
          done
          (cd "$WORK/readback" && sha256sum -c ENCRYPTED_SHA256SUMS)
          echo "Encrypted B2 upload and read-back verified."
          echo "Object prefix: s3://$B2_BUCKET/$PREFIX"

      - name: Decrypt, verify plaintext checksums and restore both databases
        shell: bash
        env:
          AGE_IDENTITY: ${{ secrets.AGE_IDENTITY }}
          RESTORE_PASSWORD: local-restore-only
        run: |
          set -euo pipefail
          WORK="$RUNNER_TEMP/heavix-b2"
          CID="$(docker ps --filter "ancestor=postgres:17" --format '{{.ID}}' | head -n1)"
          cleanup() {
            rm -rf "$WORK"
            if [ -n "$CID" ]; then docker exec "$CID" rm -f /tmp/main.dump /tmp/store.dump /tmp/main.restore.dump /tmp/store.restore.dump >/dev/null 2>&1 || true; fi
          }
          trap cleanup EXIT
          test -d "$WORK/readback"
          printf '%s\n' "$AGE_IDENTITY" > "$WORK/age-identity.txt"
          chmod 600 "$WORK/age-identity.txt"
          cd "$WORK/readback"
          age -d -i "$WORK/age-identity.txt" -o main.dump main.dump.age
          age -d -i "$WORK/age-identity.txt" -o store.dump store.dump.age
          age -d -i "$WORK/age-identity.txt" -o manifest.txt manifest.txt.age
          sha256sum -c <(grep -E ' (main|store)\.dump$' manifest.txt)
          docker cp main.dump "$CID:/tmp/main.restore.dump"
          docker cp store.dump "$CID:/tmp/store.restore.dump"
          docker exec -e PGPASSWORD="$RESTORE_PASSWORD" "$CID" createdb -h 127.0.0.1 -U restore main_restore
          docker exec -e PGPASSWORD="$RESTORE_PASSWORD" "$CID" createdb -h 127.0.0.1 -U restore store_restore
          docker exec -e PGPASSWORD="$RESTORE_PASSWORD" "$CID" pg_restore --exit-on-error --no-owner --no-acl -h 127.0.0.1 -U restore -d main_restore /tmp/main.restore.dump
          docker exec -e PGPASSWORD="$RESTORE_PASSWORD" "$CID" pg_restore --exit-on-error --no-owner --no-acl -h 127.0.0.1 -U restore -d store_restore /tmp/store.restore.dump
          main_count="$(docker exec -e PGPASSWORD="$RESTORE_PASSWORD" "$CID" psql -h 127.0.0.1 -U restore -d main_restore -XAtq -c "SELECT count(*) FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema')")"
          store_count="$(docker exec -e PGPASSWORD="$RESTORE_PASSWORD" "$CID" psql -h 127.0.0.1 -U restore -d store_restore -XAtq -c "SELECT count(*) FROM pg_tables WHERE schemaname NOT IN ('pg_catalog','information_schema')")"
          test "$main_count" -gt 0
          test "$store_count" -gt 0
          echo "PASS: paired dumps decrypted, checksums verified, both PostgreSQL 17 restores completed."
          echo "Restore smoke check: Main tables=$main_count; Store tables=$store_count."

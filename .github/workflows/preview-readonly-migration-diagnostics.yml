name: HEAVIX Preview read-only paired migration diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavix-preview-readonly-migration-diagnostics
  cancel-in-progress: false

jobs:
  inspect-preview:
    name: Inspect App and Store Preview migration history and schema (read-only)
    if: github.ref == 'refs/heads/integration/preview-readiness-workerd-2026-11-15'
    runs-on: ubuntu-latest
    environment: preview-backup
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.MAIN_PREVIEW_DATABASE_URL }}
      STORE_DATABASE_URL: ${{ secrets.STORE_PREVIEW_DATABASE_URL }}
      HEAVIX_APP_PREVIEW_DATABASE_OID: ${{ secrets.HEAVIX_APP_PREVIEW_DATABASE_OID }}
      HEAVIX_STORE_PREVIEW_DATABASE_OID: ${{ secrets.HEAVIX_STORE_PREVIEW_DATABASE_OID }}

    steps:
      - name: Enforce exact Integration branch and Preview-only read-only scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/integration/preview-readiness-workerd-2026-11-15"
          test -n "$DATABASE_URL"
          test -n "$STORE_DATABASE_URL"
          test "$DATABASE_URL" != "$STORE_DATABASE_URL"
          echo "PASS: exact Integration branch; two distinct Preview database URLs configured."

      - name: Install PostgreSQL client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Read exact Preview identities, complete migration histories and schema fingerprints
        shell: bash
        env:
          EXPECTED_APP_SYSTEM_IDENTIFIER: "7701427422680793119"
          EXPECTED_STORE_SYSTEM_IDENTIFIER: "7701425043360235551"
        run: |
          set -euo pipefail
          export PGSSLMODE=verify-full

          verify_identity() {
            local label="$1" url="$2" expected_oid="$3" expected_system="$4" observed
            if [[ ! "$expected_oid" =~ ^[1-9][0-9]{0,9}$ ]] || (( expected_oid > 4294967295 )); then
              echo "FAIL: $label Preview database OID secret is invalid."
              return 1
            fi
            observed="$(psql "$url" -XAtq -v ON_ERROR_STOP=1 -c "SELECT current_database() || '|' || (SELECT oid::text FROM pg_database WHERE datname=current_database()) || '|' || (SELECT system_identifier::text FROM pg_control_system())")"
            if [[ "$observed" != "postgres|$expected_oid|$expected_system" ]]; then
              echo "FAIL: $label Preview identity mismatch; observed identity withheld."
              return 1
            fi
            echo "PASS: $label exact Preview database identity and TLS connection."
          }

          verify_identity App "$DATABASE_URL" "$HEAVIX_APP_PREVIEW_DATABASE_OID" "$EXPECTED_APP_SYSTEM_IDENTIFIER"
          verify_identity Store "$STORE_DATABASE_URL" "$HEAVIX_STORE_PREVIEW_DATABASE_OID" "$EXPECTED_STORE_SYSTEM_IDENTIFIER"

          inspect_history() {
            local label="$1" url="$2"
            echo "### $label Preview migration history"
            psql "$url" -X -v ON_ERROR_STOP=1 -P pager=off -c "SELECT migration_name, started_at, finished_at, rolled_back_at, CASE WHEN finished_at IS NOT NULL AND rolled_back_at IS NULL THEN 'successful' WHEN rolled_back_at IS NOT NULL THEN 'rolled_back' ELSE 'unfinished' END AS state FROM public._prisma_migrations ORDER BY started_at, migration_name"
            echo "### $label Preview migration counts"
            psql "$url" -X -v ON_ERROR_STOP=1 -P pager=off -c "SELECT count(*) FILTER (WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL) AS successful, count(*) FILTER (WHERE finished_at IS NULL AND rolled_back_at IS NULL) AS unfinished, count(*) FILTER (WHERE rolled_back_at IS NOT NULL) AS rolled_back FROM public._prisma_migrations"
          }

          inspect_history App "$DATABASE_URL"
          inspect_history Store "$STORE_DATABASE_URL"

          echo "### App Preview relevant schema objects"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "SELECT table_name, column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema='public' AND ((table_name='HeroConfig' AND column_name IN ('activeTemplate','cinematicConfig')) OR (table_name='Company' AND column_name='businessType') OR (table_name='PurchaseOrder' AND column_name='submittedBy')) ORDER BY table_name, ordinal_position"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "SELECT t.relname AS table_name, i.relname AS index_name, ix.indisunique AS is_unique, pg_get_indexdef(i.oid) AS definition FROM pg_class t JOIN pg_namespace n ON n.oid=t.relnamespace JOIN pg_index ix ON ix.indrelid=t.oid JOIN pg_class i ON i.oid=ix.indexrelid WHERE n.nspname='public' AND t.relname IN ('ProductModelAttribute','UserCommercialPersona','CompanyMembership','CompanyInvitation') ORDER BY t.relname, i.relname"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('ProductModelAttribute','UserCommercialPersona','CompanyMembership','CompanyInvitation') ORDER BY table_name"
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "SELECT t.relname AS table_name, c.conname, c.contype, pg_get_constraintdef(c.oid) AS definition FROM pg_constraint c JOIN pg_class t ON t.oid=c.conrelid JOIN pg_namespace n ON n.oid=t.relnamespace WHERE n.nspname='public' AND t.relname IN ('ProductModelAttribute','UserCommercialPersona','CompanyMembership','CompanyInvitation') ORDER BY t.relname, c.conname"

          echo "### Store Preview relevant schema objects"
          psql "$STORE_DATABASE_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "SELECT table_name, column_name, data_type, is_nullable, column_default FROM information_schema.columns WHERE table_schema='public' AND table_name='PurchaseOrder' AND column_name='submittedBy' ORDER BY ordinal_position"

          echo "### Repository-independent diagnostic complete"
          echo "PASS: read-only diagnostics completed. No DDL, DML, Prisma migration, deployment, or Production connection was invoked."

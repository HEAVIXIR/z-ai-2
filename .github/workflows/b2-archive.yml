name: Backblaze B2 Archive

on:
  pull_request:
    paths:
      - '.github/workflows/b2-archive.yml'
      - 'docs/ops/BACKBLAZE-B2-ARCHIVE.md'
      - 'docs/ops/BACKUP-ENCRYPTION-DESIGN.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavix-b2-archive
  cancel-in-progress: false

jobs:
  static-validation:
    name: Validate workflow YAML and embedded Bash
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout workflow source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Parse workflow YAML and syntax-check Bash steps
        shell: bash
        run: |
          set -euo pipefail
          ruby <<'RUBY'
          require "yaml"
          require "tempfile"
          require "open3"

          workflow = YAML.load_file(".github/workflows/b2-archive.yml")
          jobs = workflow.fetch("jobs")

          static_job = jobs.fetch("static-validation")
          gate_job = jobs.fetch("database-identity-dispatch-gate")
          archive_job = jobs.fetch("archive")
          abort("Static validation must run only for pull requests") unless static_job["if"] == "github.event_name == 'pull_request'"
          abort("Dispatch gate must be workflow_dispatch-only") unless gate_job["if"] == "github.event_name == 'workflow_dispatch'"
          abort("Archive must require the dispatch gate") unless archive_job["needs"] == "database-identity-dispatch-gate"
          abort("Archive must be workflow_dispatch-only") unless archive_job["if"] == "github.event_name == 'workflow_dispatch'"
          gate_script = gate_job.fetch("steps").map { |step| step["run"].to_s }.join("\\n")
          gate_env_bindings = gate_job.fetch("steps").map { |step| step.fetch("env", {}).map { |key, value| "#{key}=#{value}" }.join(" ") }.join(" ")
          gate_configuration = gate_script + " " + gate_env_bindings
          abort("Preview identity attestation latch is missing") unless gate_configuration.include?("HEAVIX_B2_DB_IDENTITY_GATE") && gate_script.include?("VERIFIED_PREVIEW_ONLY")
          abort("Archive readiness attestation latch is missing") unless gate_configuration.include?("HEAVIX_B2_ARCHIVE_READINESS_GATE") && gate_script.include?("APPROVED_PREVIEW_ARCHIVE_V1")
          abort("Client-side encryption must remain a hard blocker until implemented") unless gate_configuration.include?("ENCRYPTION_IMPLEMENTATION=false") && gate_script.include?("Plaintext database dumps must never be uploaded to B2.")
          abort("Database archives must use the dedicated backup bucket") unless archive_job.fetch("env").fetch("B2_BUCKET") == "heavix-db-backups"
          encryption_design = File.read("docs/ops/BACKUP-ENCRYPTION-DESIGN.md")
          abort("Encryption design must require offline private-key custody") unless encryption_design.include?("offline") && encryption_design.include?("runner must never receive the private identity")
          abort("Encryption design must keep Production excluded") unless encryption_design.include?("No Production database or Production credentials")
          upload_script = archive_job.fetch("steps").find { |step| step["name"] == "Verify B2 bucket and archive objects" }.fetch("run")
          abort("Read-back verification must special-case SHA256SUMS") unless upload_script.include?('if [[ "$file" == "SHA256SUMS" ]]')
          abort("Read-back verification must compare downloaded bytes") unless upload_script.include?('sha256sum "$RUNNER_TEMP/heavix-b2-readback/$file"')

          checked = 0

          jobs.each do |job_name, job|
            job.fetch("steps", []).each_with_index do |step, index|
              script = step["run"]
              next unless script.is_a?(String)
              next unless step["shell"].to_s.start_with?("bash")

              Tempfile.create(["heavix-b2-step-", ".sh"]) do |file|
                file.write(script)
                file.flush
                _stdout, stderr, status = Open3.capture3("bash", "-n", file.path)
                unless status.success?
                  abort("Bash syntax error in job #{job_name}, step #{index + 1}: #{stderr}")
                end
              end
              checked += 1
            end
          end

          abort("No Bash run blocks were validated") if checked.zero?
          puts("Workflow YAML parsed; #{checked} embedded Bash blocks passed bash -n.")
          RUBY
      - name: Exercise manifest and read-back checksums with synthetic files
        shell: bash
        run: |
          set -euo pipefail
          TEMP_ARCHIVE="$(mktemp -d)"
          trap 'rm -rf "$TEMP_ARCHIVE"' EXIT
          cd "$TEMP_ARCHIVE"

          printf 'main test payload\n' > main.dump
          printf 'store test payload\n' > store.dump
          printf 'git bundle test payload\n' > source.bundle
          printf '{"fixture":"manifest"}\n' > manifest.json

          sha256sum main.dump store.dump source.bundle manifest.json > SHA256SUMS
          for file in main.dump store.dump source.bundle manifest.json SHA256SUMS; do
            if [[ "$file" == "SHA256SUMS" ]]; then
              EXPECTED_SHA="$(sha256sum SHA256SUMS | awk '{print $1}')"
            else
              EXPECTED_SHA="$(awk -v name="$file" '$2 == name {print $1}' SHA256SUMS)"
            fi
            ACTUAL_SHA="$(sha256sum "$file" | awk '{print $1}')"
            if [[ -z "$EXPECTED_SHA" || "$EXPECTED_SHA" != "$ACTUAL_SHA" ]]; then
              echo "::error::Synthetic checksum verification failed for $file"
              exit 1
            fi
          done

          EXPECTED_SHA="$(awk '$2 == "main.dump" {print $1}' SHA256SUMS)"
          printf 'tamper' >> main.dump
          ACTUAL_SHA="$(sha256sum main.dump | awk '{print $1}')"
          if [[ "$EXPECTED_SHA" == "$ACTUAL_SHA" ]]; then
            echo "::error::Synthetic tamper detection did not detect changed bytes"
            exit 1
          fi
          echo "Synthetic manifest, self-checksum, read-back, and tamper-detection checks passed."
  database-identity-dispatch-gate:
    name: Require Preview identity, archive readiness, and encryption implementation
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail closed until Preview identity and archive readiness are attested
        shell: bash
        env:
          IDENTITY_GATE: ${{ vars.HEAVIX_B2_DB_IDENTITY_GATE }}
          ARCHIVE_READINESS_GATE: ${{ vars.HEAVIX_B2_ARCHIVE_READINESS_GATE }}
          ENCRYPTION_IMPLEMENTATION: "false"
        run: |
          set -euo pipefail
          if [[ "$IDENTITY_GATE" != "VERIFIED_PREVIEW_ONLY" ]]; then
            echo "::error::Archive blocked: HEAVIX_B2_DB_IDENTITY_GATE is not VERIFIED_PREVIEW_ONLY. Independently verify both dedicated Preview DB identities and read-only credential scope before setting this repository variable."
            exit 1
          fi
          if [[ "$ARCHIVE_READINESS_GATE" != "APPROVED_PREVIEW_ARCHIVE_V1" ]]; then
            echo "::error::Archive blocked: archive readiness is not approved. Require the dedicated private backup bucket, bucket-scoped key, client-side encryption and recovery-key custody, bounded retention/data cap, and isolated restore target before setting this variable."
            exit 1
          fi
          if [[ "$ENCRYPTION_IMPLEMENTATION" != "true" ]]; then
            echo "::error::Archive blocked: client-side encryption is not implemented in this workflow. Plaintext database dumps must never be uploaded to B2."
            exit 1
          fi
          echo "Preview identity, archive readiness, and encryption implementation gates are present."

  archive:
    if: github.event_name == 'workflow_dispatch'
    needs: database-identity-dispatch-gate
    name: Verify and archive databases and Git history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_DEFAULT_REGION: us-east-005
      AWS_EC2_METADATA_DISABLED: "true"
      B2_ENDPOINT: https://s3.us-east-005.backblazeb2.com
      B2_BUCKET: heavix-db-backups
      B2_PREFIX: heavix-archive

    steps:
      - name: Checkout complete HEAVIX repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout complete legacy repository history
        uses: actions/checkout@v6
        with:
          repository: HEAVIXIR/z
          path: legacy-source
          fetch-depth: 0
          persist-credentials: false

      - name: Validate required configuration without printing secrets
        id: config
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.HEAVIX_DATABASE_URL }}
          STORE_DATABASE_URL: ${{ secrets.HEAVIX_STORE_DATABASE_URL }}
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          for name in DATABASE_URL STORE_DATABASE_URL B2_APPLICATION_KEY_ID B2_APPLICATION_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret is missing: $name"
              exit 1
            fi
          done
          python3 - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          prisma_only = {"schema", "connection_limit", "pool_timeout", "pgbouncer", "statement_cache_size"}
          for source, target in (("DATABASE_URL", "pg_dsn_main"), ("STORE_DATABASE_URL", "pg_dsn_store")):
              raw = os.environ[source]
              parsed = urlsplit(raw)
              if parsed.scheme not in {"postgres", "postgresql"} or not parsed.hostname or not parsed.path.strip("/"):
                  raise SystemExit(f"{source} is not a complete PostgreSQL URL")
              query = [(k, v) for k, v in parse_qsl(parsed.query, keep_blank_values=True) if k.lower() not in prisma_only]
              dsn = urlunsplit((parsed.scheme, parsed.netloc, parsed.path, urlencode(query), parsed.fragment))
              if chr(10) in dsn or chr(13) in dsn:
                  raise SystemExit(f"{source} contains invalid line breaks")
              print(f"::add-mask::{dsn}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write(f"{target}={dsn}" + chr(10))
          print("PostgreSQL URLs validated; Prisma-only URL parameters removed for libpq.")
          PY
          command -v aws >/dev/null
          aws --version
          docker --version
          git --version

      - name: Scan complete Git histories for exposed secrets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="8.30.1"
          SCANNER_DIR="$RUNNER_TEMP/gitleaks"
          mkdir -p "$SCANNER_DIR"
          cd "$SCANNER_DIR"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v$VERSION"
          curl -fsSLo "gitleaks_${VERSION}_linux_x64.tar.gz" "$BASE/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLo "gitleaks_${VERSION}_checksums.txt" "$BASE/gitleaks_${VERSION}_checksums.txt"
          sha256sum --ignore-missing --check "gitleaks_${VERSION}_checksums.txt"
          tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" gitleaks
          chmod 0755 gitleaks
          ./gitleaks version
          ./gitleaks git "$GITHUB_WORKSPACE" --redact --no-banner
          ./gitleaks git "$GITHUB_WORKSPACE/legacy-source" --redact --no-banner
          echo "Both complete Git histories passed the Gitleaks scan."

      - name: Create paired PostgreSQL 17 logical backups
        shell: bash
        env:
          PG_DSN_MAIN: ${{ steps.config.outputs.pg_dsn_main }}
          PG_DSN_STORE: ${{ steps.config.outputs.pg_dsn_store }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/heavix-archive"
          chmod 700 "$RUNNER_TEMP/heavix-archive"

          docker run --rm \
            -e PG_DSN_MAIN \
            -v "$RUNNER_TEMP/heavix-archive:/archive" \
            postgres:17-alpine \
            sh -ec 'pg_dump --no-owner --no-privileges --format=custom --dbname="$PG_DSN_MAIN" --file=/archive/main.dump'

          docker run --rm \
            -e PG_DSN_STORE \
            -v "$RUNNER_TEMP/heavix-archive:/archive" \
            postgres:17-alpine \
            sh -ec 'pg_dump --no-owner --no-privileges --format=custom --dbname="$PG_DSN_STORE" --file=/archive/store.dump'

          test -s "$RUNNER_TEMP/heavix-archive/main.dump"
          test -s "$RUNNER_TEMP/heavix-archive/store.dump"

          docker run --rm -v "$RUNNER_TEMP/heavix-archive:/archive" postgres:17-alpine \
            pg_restore --list /archive/main.dump >/dev/null
          docker run --rm -v "$RUNNER_TEMP/heavix-archive:/archive" postgres:17-alpine \
            pg_restore --list /archive/store.dump >/dev/null

      - name: Create complete source-history bundles and source snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git bundle create "$RUNNER_TEMP/heavix-archive/heavix-source.bundle" --all
          git bundle verify "$RUNNER_TEMP/heavix-archive/heavix-source.bundle"
          git archive --format=tar.gz --prefix=heavix-source/ HEAD \
            > "$RUNNER_TEMP/heavix-archive/heavix-source.tar.gz"

          git -C legacy-source bundle create \
            "$RUNNER_TEMP/heavix-archive/heavix-legacy.bundle" --all
          git -C legacy-source bundle verify \
            "$RUNNER_TEMP/heavix-archive/heavix-legacy.bundle"
          git -C legacy-source archive --format=tar.gz --prefix=heavix-legacy/ HEAD \
            > "$RUNNER_TEMP/heavix-archive/heavix-legacy.tar.gz"

      - name: Build integrity manifest
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/heavix-archive"
          TARGET_SHA="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          LEGACY_SHA="$(git -C "$GITHUB_WORKSPACE/legacy-source" rev-parse HEAD)"
          CREATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          jq -n \
            --arg created_at "$CREATED_AT" \
            --arg target_repository "HEAVIXIR/z-ai-2" \
            --arg target_commit "$TARGET_SHA" \
            --arg legacy_repository "HEAVIXIR/z" \
            --arg legacy_commit "$LEGACY_SHA" \
            --arg workflow_run "$GITHUB_RUN_ID" \
            --arg workflow_attempt "$GITHUB_RUN_ATTEMPT" \
            --arg main_bytes "$(stat -c %s main.dump)" \
            --arg store_bytes "$(stat -c %s store.dump)" \
            '{created_at:$created_at, target:{repository:$target_repository,commit:$target_commit}, legacy:{repository:$legacy_repository,commit:$legacy_commit}, workflow:{run_id:$workflow_run,attempt:$workflow_attempt}, databases:{main:{format:"pg_dump custom",bytes:($main_bytes|tonumber)},store:{format:"pg_dump custom",bytes:($store_bytes|tonumber)}}, integrity:"SHA256SUMS"}' \
            > manifest.json

          # Hash every payload and the manifest. SHA256SUMS itself is verified
          # separately after download because a checksum file cannot hash itself.
          sha256sum main.dump store.dump heavix-source.bundle heavix-source.tar.gz \
            heavix-legacy.bundle heavix-legacy.tar.gz manifest.json > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Verify B2 bucket and archive objects
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.B2_APPLICATION_KEY }}
        run: |
          set -euo pipefail
          aws --endpoint-url "$B2_ENDPOINT" s3api head-bucket --bucket "$B2_BUCKET"

          STAMP="$(date -u +%Y/%m/%d)"
          DEST="$B2_PREFIX/$STAMP/run-$GITHUB_RUN_ID-attempt-$GITHUB_RUN_ATTEMPT"
          cd "$RUNNER_TEMP/heavix-archive"

          for file in main.dump store.dump heavix-source.bundle heavix-source.tar.gz \
                      heavix-legacy.bundle heavix-legacy.tar.gz SHA256SUMS manifest.json; do
            aws --endpoint-url "$B2_ENDPOINT" s3 cp "$file" \
              "s3://$B2_BUCKET/$DEST/$file" --only-show-errors
            LOCAL_BYTES="$(stat -c %s "$file")"
            REMOTE_BYTES="$(aws --endpoint-url "$B2_ENDPOINT" s3api head-object \
              --bucket "$B2_BUCKET" --key "$DEST/$file" --query ContentLength --output text)"
            if [[ "$LOCAL_BYTES" != "$REMOTE_BYTES" ]]; then
              echo "::error::B2 size verification failed for $file"
              exit 1
            fi

            # Verify the stored bytes, not only object metadata. This is a
            # read-after-write integrity check using the locally generated
            # SHA-256 manifest as the expected digest.
            mkdir -p "$RUNNER_TEMP/heavix-b2-readback"
            aws --endpoint-url "$B2_ENDPOINT" s3 cp \
              "s3://$B2_BUCKET/$DEST/$file" \
              "$RUNNER_TEMP/heavix-b2-readback/$file" --only-show-errors
            if [[ "$file" == "SHA256SUMS" ]]; then
              EXPECTED_SHA="$(sha256sum SHA256SUMS | awk '{print $1}')"
            else
              EXPECTED_SHA="$(awk -v name="$file" '$2 == name {print $1}' SHA256SUMS)"
            fi
            ACTUAL_SHA="$(sha256sum "$RUNNER_TEMP/heavix-b2-readback/$file" | awk '{print $1}')"
            if [[ -z "$EXPECTED_SHA" || "$EXPECTED_SHA" != "$ACTUAL_SHA" ]]; then
              echo "::error::B2 read-back SHA-256 verification failed for $file"
              exit 1
            fi
          done

          echo "B2 archive verified by remote object size and SHA-256 read-back."
          echo "Archive prefix: s3://$B2_BUCKET/$DEST/"

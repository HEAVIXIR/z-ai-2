name: Refresh worker adapter Bun lockfile

on:
  push:
    branches:
      - infra/cloudflare-opennext-build-recovery
      - security/active-session-hardening-2026-11-08

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Resolve pinned Worker adapter dependencies
        run: bun install
      - name: Commit refreshed lockfile
        run: |
          if ! git diff --quiet -- bun.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add bun.lock
            git commit -m "chore: refresh Bun lockfile for Cloudflare build"
            git push origin "HEAD:${{ github.ref_name }}"
          else
            echo "bun.lock already up to date"
          fi

name: Cloudflare Worker Wrangler Dry-Run Proof

on:
  push:
    branches:
      - 'proof/webpack-worker-wasm-2026-11-11'
    paths:
      - '.github/workflows/cloudflare-wrangler-dry-run-proof.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  wrangler-dry-run:
    name: Package exact OpenNext artifact with Wrangler (no upload)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Non-routable placeholders only. --dry-run must never contact a database.
      DATABASE_URL: "postgresql://dry-run.invalid:5432/app"
      STORE_DATABASE_URL: "postgresql://dry-run.invalid:5432/store"
      HEAVIX_APP_PREVIEW_DATABASE_OID: "1"
      HEAVIX_STORE_PREVIEW_DATABASE_OID: "2"
      HEAVIX_ENV: "preview"
      NODE_ENV: "production"
    steps:
      - name: Checkout exact source and Wrangler configuration
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Download the inspected OpenNext artifact
        uses: actions/download-artifact@v4
        with:
          name: heavix-open-next-webpack-6baee22f25e169536dba96fb7621123d7a13c791
          repository: HEAVIXIR/z-ai-2
          run-id: 43010880902
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .open-next

      - name: Verify downloaded artifact shape
        shell: bash
        run: |
          set -euo pipefail
          test -s .open-next/worker.js
          test -s .open-next/cloudflare/init.js
          test -s .open-next/middleware/handler.mjs
          test -s .open-next/server-functions/default/handler.mjs
          test -s .open-next/.build/durable-objects/queue.js
          test -s .open-next/.build/durable-objects/sharded-tag-cache.js
          test -s .open-next/.build/durable-objects/bucket-cache-purge.js
          test -s .open-next/server-functions/default/src/lib/generated/worker-client/internal/query_compiler_bg.wasm
          test -s .open-next/server-functions/default/src/lib/generated/store-worker-client/internal/query_compiler_bg.wasm
          echo "PASS: exact inspected OpenNext artifact restored"

      - name: Run Wrangler deploy dry-run only
        run: |
          set -euo pipefail
          bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/heavix-wrangler-dry-run"
          test -d "$RUNNER_TEMP/heavix-wrangler-dry-run"
          echo "PASS: Wrangler packaged the Worker without uploading or deploying"

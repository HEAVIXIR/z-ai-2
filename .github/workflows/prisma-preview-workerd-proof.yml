# Manual proof workflow. CI's database-backed proof remains opt-in and runs from the approved Preview environment.
name: Prisma Preview Workerd Runtime Proof

on:
  workflow_dispatch:
    inputs:
      confirm_preview_only:
        description: Confirm both configured connection strings are dedicated Preview resources
        required: true
        type: choice
        options:
          - PREVIEW_ONLY

permissions:
  contents: read

concurrency:
  group: heavix-prisma-workerd-proof
  cancel-in-progress: false

jobs:
  runtime-proof:
    name: Read-only App + Store Workerd proof
    runs-on: ubuntu-latest
    environment: preview-backup
    timeout-minutes: 20
    env:
      HEAVIX_RUNTIME_PROOF_TARGET: ${{ inputs.confirm_preview_only || 'PREVIEW_ONLY' }}
      HEAVIX_APP_PREVIEW_PPG_URL: ${{ secrets.MAIN_PREVIEW_DATABASE_URL }}
      HEAVIX_STORE_PREVIEW_PPG_URL: ${{ secrets.STORE_PREVIEW_DATABASE_URL }}
    steps:
      - name: Checkout the exact commit selected for this workflow run
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify exact commit and intended proof branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/infra/prisma6-cloudflare-runtime"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Running Workerd proof against exact selected commit: $GITHUB_SHA"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Generate isolated App and Store Worker clients
        run: |
          bunx prisma generate --schema=prisma/schema.prisma
          bunx prisma generate --schema=prisma/store/schema.prisma

      - name: Fail closed unless both Preview inputs are supplied
        shell: bash
        run: |
          set -euo pipefail
          test "$HEAVIX_RUNTIME_PROOF_TARGET" = "PREVIEW_ONLY"
          test -n "$HEAVIX_APP_PREVIEW_PPG_URL"
          test -n "$HEAVIX_STORE_PREVIEW_PPG_URL"
          test "$HEAVIX_APP_PREVIEW_PPG_URL" != "$HEAVIX_STORE_PREVIEW_PPG_URL"
          echo "Two distinct Preview connection inputs are present; values remain redacted."

      - name: Execute read-only local Workerd runtime proof
        run: bun run test:workerd

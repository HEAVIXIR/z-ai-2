name: Store Audit Outbox Drain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-audit-outbox-drain
  cancel-in-progress: false

jobs:
  drain:
    # Explicit release gate: manual dispatch alone must not activate the worker.
    if: vars.STORE_AUDIT_OUTBOX_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Allow curl's 3 x 45s maximum attempts plus retry delays and runner setup.
    timeout-minutes: 4
    steps:
      - name: Validate worker configuration
        env:
          HEAVIX_BASE_URL: ${{ vars.HEAVIX_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS: ${{ vars.STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS }}
        run: |
          if [ -z "$HEAVIX_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set STORE_AUDIT_OUTBOX_ENABLED=true only after explicit release approval; also configure HEAVIX_BASE_URL and CRON_SECRET."
            exit 1
          fi
          if ! [[ "$STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Configure STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS as a positive integer SLO before enabling the worker."
            exit 1
          fi
          case "$HEAVIX_BASE_URL" in
            https://*) ;;
            *) echo "::error::HEAVIX_BASE_URL must use HTTPS"; exit 1 ;;
          esac

      - name: Drain pending audit events
        env:
          HEAVIX_BASE_URL: ${{ vars.HEAVIX_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS: ${{ vars.STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS }}
        run: |
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --max-time 45 --retry 2 --retry-delay 2 \
            -X POST "${HEAVIX_BASE_URL%/}/api/internal/store-audit-outbox" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json")"
          printf '%s' "$RESPONSE" | node -e '
            let raw = "";
            process.stdin.setEncoding("utf8");
            process.stdin.on("data", (chunk) => { raw += chunk; });
            process.stdin.on("end", () => {
              let result;
              try {
                result = JSON.parse(raw);
              } catch {
                console.error("FAIL: worker returned invalid JSON");
                process.exit(1);
              }
              const stats = result?.stats;
              const drain = result?.drain;
              const maxAgeSeconds = Number(process.env.STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS);
              if (result?.ok !== true || !stats || !drain || !Number.isSafeInteger(maxAgeSeconds) || maxAgeSeconds < 1) {
                console.error("FAIL: worker response/configuration did not satisfy the monitoring contract");
                process.exit(1);
              }
              const oldestMs = stats.oldestPendingAt == null ? null : Date.parse(stats.oldestPendingAt);
              const outstanding = Number(stats.pending ?? 0) + Number(stats.processing ?? 0);
              const ageSeconds = oldestMs == null || !Number.isFinite(oldestMs)
                ? null
                : Math.max(0, Math.floor((Date.now() - oldestMs) / 1000));
              const summary = {
                deliveredThisRun: Number(drain.delivered ?? 0),
                failedThisRun: Number(drain.failed ?? 0),
                pending: Number(stats.pending ?? 0),
                processing: Number(stats.processing ?? 0),
                failed: Number(stats.failed ?? 0),
                oldestPendingAgeSeconds: ageSeconds,
                maxPendingAgeSeconds: maxAgeSeconds
              };
              console.log(JSON.stringify(summary));
              const problems = [];
              if (summary.failedThisRun > 0) problems.push("one or more deliveries failed during this run");
              if (summary.failed > 0) problems.push("FAILED outbox rows require investigation");
              if (outstanding > 0 && (ageSeconds == null || ageSeconds > maxAgeSeconds)) {
                problems.push("oldest outstanding outbox event exceeds the configured age SLO");
              }
              if (problems.length) {
                console.error("FAIL: " + problems.join("; "));
                process.exit(1);
              }
            });
          '

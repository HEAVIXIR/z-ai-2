name: Store Audit Outbox Drain

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-audit-outbox-drain
  cancel-in-progress: false

jobs:
  drain:
    # Explicit release gate: manual dispatch alone must not activate the worker.
    if: vars.STORE_AUDIT_OUTBOX_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Allow curl's 3 x 45s maximum attempts plus retry delays and runner setup.
    timeout-minutes: 4
    steps:
      - name: Validate worker configuration
        env:
          HEAVIX_BASE_URL: ${{ vars.HEAVIX_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS: ${{ vars.STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS }}
        run: |
          if [ -z "$HEAVIX_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set STORE_AUDIT_OUTBOX_ENABLED=true only after explicit release approval; also configure HEAVIX_BASE_URL and CRON_SECRET."
            exit 1
          fi
          if ! [[ "$STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Configure STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS as a positive integer SLO before enabling the worker."
            exit 1
          fi
          case "$HEAVIX_BASE_URL" in
            https://*) ;;
            *) echo "::error::HEAVIX_BASE_URL must use HTTPS"; exit 1 ;;
          esac

      - name: Drain pending audit events
        env:
          HEAVIX_BASE_URL: ${{ vars.HEAVIX_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS: ${{ vars.STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS }}
        run: |
          RESPONSE="$(curl --fail-with-body --silent --show-error \
            --max-time 45 --retry 2 --retry-delay 2 \
            -X POST "${HEAVIX_BASE_URL%/}/api/internal/store-audit-outbox" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json")"
          printf '%s' "$RESPONSE" | node scripts/check-store-audit-outbox-response.mjs "$STORE_AUDIT_OUTBOX_MAX_PENDING_AGE_SECONDS"

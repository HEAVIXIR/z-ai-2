name: Store Audit Outbox Drain

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: store-audit-outbox-drain
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate worker configuration
        env:
          HEAVIX_BASE_URL: ${{ vars.HEAVIX_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$HEAVIX_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Configure repository variable HEAVIX_BASE_URL and repository secret CRON_SECRET before enabling the scheduled outbox worker."
            exit 1
          fi
          case "$HEAVIX_BASE_URL" in
            https://*) ;;
            *) echo "::error::HEAVIX_BASE_URL must use HTTPS"; exit 1 ;;
          esac

      - name: Drain pending audit events
        env:
          HEAVIX_BASE_URL: ${{ vars.HEAVIX_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 45 --retry 2 --retry-delay 2 \
            -X POST "${HEAVIX_BASE_URL%/}/api/internal/store-audit-outbox" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json"

name: HEAVIX App Preview sequential single-migration gate

on:
  push:
    branches:
      - integration/preview-readiness-workerd-2026-11-15
    paths:
      - .github/preview-migration-request.json

permissions:
  contents: read

jobs:
  resolve_request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact Integration request commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate one-time migration request
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/integration/preview-readiness-workerd-2026-11-15"
          test -f .github/preview-migration-request.json
          target="$(jq -r '.target // empty' .github/preview-migration-request.json)"
          migration="$(jq -r '.migration // empty' .github/preview-migration-request.json)"
          confirm="$(jq -r '.confirm // empty' .github/preview-migration-request.json)"
          test "$target" = "APP_PREVIEW_ONLY"
          if [[ "$migration" == "NONE" && "$confirm" == "NONE" ]]; then
            echo "PASS: no migration requested; no environment or database access."
            exit 0
          fi
          case "$migration" in
            LINK_LISTING_SERVICE_RFQ) token="APPLY_APP_PREVIEW_20261118152000" ;;
            WANTED_STRUCTURAL) token="APPLY_APP_PREVIEW_20261119160000" ;;
            GEO_FOUNDATION) token="APPLY_APP_PREVIEW_20261119190000" ;;
            LOCATION_SOURCE_CODES) token="APPLY_APP_PREVIEW_20261120113000" ;;
            CATEGORY_ATTRIBUTE_ACTIVE_POLICY) token="APPLY_APP_PREVIEW_20261120130000" ;;
            BUY_REQUEST_IMAGES) token="APPLY_APP_PREVIEW_20261120150000" ;;
            *) echo "Unsupported migration request."; exit 1 ;;
          esac
          test "$confirm" = "$token"
          grep -Fq "$token" <<< "$(git log -1 --format=%B)"
          echo "PASS: typed migration request and commit marker validated; execution workflow will be added after parser proof."
